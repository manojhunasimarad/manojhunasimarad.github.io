<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dalal Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hind:wght@400;500;600&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky belt bar on top, one scrolling view, fixed five-tab bar, bottom sheets. */
:root {
  --bg: #F1F2F7;
  --surface: #FFFFFF;
  --sunk: #E7E9F1;
  --ink: #161A2E;
  --muted: #5B617E;
  --line: #D8DBE6;
  --accent: #3442B0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E5FA;
  --gold: #B87A06;
  --gold-soft: #FBEFD3;
  --up: #0F7D57;
  --up-soft: #DCF2E8;
  --down: #C0392F;
  --down-soft: #FAE2DF;
  --slip: #FCFBF7;
  --slip-ink: #2A2E40;
  --on-solid: #FFFFFF;
  --s1: #3442B0; --s2: #C9800F; --s3: #17857F; --s4: #A9407F; --s5: #6A7088; --s6: #7B5A2A;
  --shadow: 0 1px 2px rgba(22,26,46,.06), 0 6px 20px rgba(22,26,46,.06);
  --display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body: "Hind", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1020; --surface: #161A2D; --sunk: #0A0C18; --ink: #E6E8F3; --muted: #9BA1BF; --line: #272D46;
    --accent: #909CFF; --accent-ink: #0D1020; --accent-soft: #222A55;
    --gold: #F1B53F; --gold-soft: #3A2D10;
    --up: #3CCB8F; --up-soft: #10301F; --down: #FF7166; --down-soft: #3B1714;
    --slip: #1D2236; --slip-ink: #DADDEB; --on-solid: #0D1020;
    --s1: #909CFF; --s2: #F1B53F; --s3: #45C8BE; --s4: #E77FBF; --s5: #A3A9C2; --s6: #D2A262;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1020; --surface: #161A2D; --sunk: #0A0C18; --ink: #E6E8F3; --muted: #9BA1BF; --line: #272D46;
  --accent: #909CFF; --accent-ink: #0D1020; --accent-soft: #222A55;
  --gold: #F1B53F; --gold-soft: #3A2D10;
  --up: #3CCB8F; --up-soft: #10301F; --down: #FF7166; --down-soft: #3B1714;
  --slip: #1D2236; --slip-ink: #DADDEB; --on-solid: #0D1020;
  --s1: #909CFF; --s2: #F1B53F; --s3: #45C8BE; --s4: #E77FBF; --s5: #A3A9C2; --s6: #D2A262;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); text-underline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }

.app { max-width: 560px; margin: 0 auto; }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.belt-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; text-align: left; min-width: 0; }
.belt-band { position: relative; width: 38px; height: 12px; border-radius: 3px; background: var(--belt, #eee); border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); flex: none; }
.belt-band::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 18px; transform: translate(-50%, -50%) rotate(14deg); background: var(--belt, #eee); border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 3px; }
.belt-meta { display: grid; line-height: 1.15; min-width: 0; }
.belt-meta b { font-family: var(--display); font-size: 1rem; }
.belt-meta small { color: var(--muted); font-size: 0.75rem; }
.xpbar { height: 4px; border-radius: 4px; background: var(--sunk); overflow: hidden; margin-top: 3px; width: 96px; }
.xpbar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.top .nw { margin-left: auto; text-align: right; line-height: 1.1; min-width: 0; }
.top .nw small { display: block; color: var(--muted); font-size: 0.72rem; }
.top .nw b { font-family: var(--mono); font-size: 1rem; font-weight: 500; }
.top .nw span { font-family: var(--mono); font-size: 0.75rem; margin-left: 4px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* Main */
.main { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.main > *, .sheet-body > *, .stack > *, .hero > *, .reader > *, .q > *, .module > * { min-width: 0; }
.view-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-title h1 { font-size: 1.6rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }

/* Status strip */
.status { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.open { background: var(--up-soft); color: var(--up); }
.pill.closed { background: var(--down-soft); color: var(--down); }
.pill.sim { background: var(--gold-soft); color: var(--gold); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 0.92rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.buy { background: var(--up); border-color: var(--up); color: var(--on-solid); }
.btn.sell { background: var(--down); border-color: var(--down); color: var(--on-solid); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 0.84rem; border-radius: 8px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }

/* Hero account card */
.hero { display: grid; gap: 12px; }
.hero .big { font-family: var(--display); font-size: 2.2rem; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kv div { min-width: 0; }
.kv small { display: block; color: var(--muted); font-size: 0.75rem; }
.kv b { font-family: var(--mono); font-weight: 500; font-size: 0.92rem; overflow-wrap: anywhere; }
.curve { width: 100%; height: 56px; display: block; }

/* Sim controls */
.simbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.simbar .clock { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); margin-right: auto; }

/* Next up */
.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; padding-top: 2px; }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 0.8rem; background: var(--accent-soft); color: var(--accent); }
.step .n.act { background: var(--gold-soft); color: var(--gold); }
.step b { display: block; font-weight: 600; line-height: 1.25; }
.step small { color: var(--muted); font-size: 0.8rem; }

/* Ticker tape */
.tape { overflow: hidden; border-block: 1px solid var(--line); margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); background: var(--surface); }
.tape-inner { display: flex; width: max-content; animation: tape 60s linear infinite; }
.tape span { padding: 8px 14px; font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; border-right: 1px solid var(--line); }
.tape span b { font-weight: 500; margin-right: 6px; color: var(--ink); }
@keyframes tape { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape { overflow-x: auto; } .tape-inner { animation: none; } }

/* Badges */
.badges { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.badge { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--sunk); color: var(--muted); border: 1px dashed var(--line); }
.badge.on { background: var(--gold-soft); color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.badge svg { width: 22px; height: 22px; }

/* Chips / filters */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.85rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Instrument rows */
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0,1fr) 64px auto; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row .sym { font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .name { color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .px { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.row .px small { display: block; font-size: 0.78rem; }
.tag { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 5px; background: var(--sunk); color: var(--muted); }
.tag.gold { background: var(--gold-soft); color: var(--gold); }
.spark { width: 64px; height: 26px; display: block; }

/* Holdings */
.hold { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; padding: 12px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.hold:first-child { border-top: 0; }
.hold .l small, .hold .r small { display: block; color: var(--muted); font-size: 0.78rem; font-family: var(--mono); }
.hold .r { text-align: right; font-family: var(--mono); }

/* Allocation bars */
.alloc { display: grid; gap: 8px; }
.alloc-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--sunk); }
.alloc-bar i { display: block; height: 100%; }
.alloc-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.82rem; }
.alloc-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); }
.c-equity { --c: var(--s1); } .c-gold { --c: var(--s2); } .c-debt { --c: var(--s3); } .c-cash { --c: var(--s5); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td:first-child { font-family: var(--body); font-weight: 600; white-space: normal; }
.tbl th:not(:first-child), .tbl td:not(:first-child) { text-align: right; }

/* Learn */
.module { display: grid; gap: 10px; }
.module-head { display: flex; gap: 12px; align-items: flex-start; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.module-head .mn { font-family: var(--display); font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; width: 28px; flex: none; }
.module-head h3 { margin-bottom: 2px; }
.module-head p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.prog { height: 6px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.lesson-row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.lesson-row .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.lesson-row .tick.done { background: var(--up); border-color: var(--up); color: var(--on-solid); }
.lesson-row .tick svg { width: 14px; height: 14px; }
.lesson-row small { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
.source { font-size: 0.82rem; color: var(--muted); border-left: 3px solid var(--gold); padding: 2px 0 2px 10px; }

/* Reader */
.reader { display: grid; gap: 14px; max-width: 65ch; }
.reader p { margin: 0; }
.reader ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.callout { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: 0.93rem; }
.takeaway { background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; }
.takeaway b { display: block; font-family: var(--display); margin-bottom: 2px; }

/* Contract-note slip: the perforated edge is the receipt you'd get from a broker */
.slip { position: relative; background: var(--slip); color: var(--slip-ink); border-radius: 0 0 12px 12px; padding: 16px; margin-top: 10px; font-family: var(--mono); font-size: 0.84rem; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-top: 0; }
.slip::before { content: ""; position: absolute; left: -1px; right: -1px; top: -9px; height: 9px; background: radial-gradient(circle at 7px 0, transparent 5.5px, var(--slip) 6px) repeat-x; background-size: 14px 9px; }
.slip h4 { margin: 0 0 8px; font-family: var(--body); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.slip .ln { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.slip .ln span:first-child { color: color-mix(in srgb, var(--slip-ink) 72%, transparent); }
.slip .ln.total { border-top: 1px dashed color-mix(in srgb, var(--slip-ink) 35%, transparent); margin-top: 6px; padding-top: 8px; font-weight: 500; }
.slip .ln.total span:first-child { color: var(--slip-ink); }

/* Quiz */
.q { display: grid; gap: 10px; }
.q h3 { font-family: var(--body); font-weight: 600; font-size: 1.05rem; line-height: 1.35; }
.opt { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.35; }
.opt.right { border-color: var(--up); background: var(--up-soft); }
.opt.wrong { border-color: var(--down); background: var(--down-soft); }
.opt[disabled] { cursor: default; }
.explain { font-size: 0.92rem; padding: 10px 12px; border-radius: 10px; background: var(--sunk); }
.qprog { display: flex; gap: 4px; }
.qprog i { flex: 1; height: 4px; border-radius: 4px; background: var(--sunk); }
.qprog i.done { background: var(--accent); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(8, 10, 22, 0.45); opacity: 0; transition: opacity .2s; border: 0; width: 100%; }
.sheet.open .sheet-scrim { opacity: 1; }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding-top: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
}
.sheet.full .sheet-panel { height: calc(100% - env(safe-area-inset-top, 0px) - 12px); }
.sheet.open .sheet-panel { transform: none; }
@media (prefers-reduced-motion: reduce) { .sheet-panel, .sheet-scrim { transition: none; } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* Forms */
.field { display: grid; gap: 4px; }
.field label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-family: var(--mono); font-size: 1rem; }
.input:focus { border-color: var(--accent); outline: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.buy-sell button[aria-pressed="true"][data-v="B"] { background: var(--up); color: var(--on-solid); }
.seg.buy-sell button[aria-pressed="true"][data-v="S"] { background: var(--down); color: var(--on-solid); }
.stepper { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; gap: 6px; }
.stepper .btn { padding: 0; font-size: 1.2rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.err { color: var(--down); font-size: 0.88rem; }
.hint { color: var(--muted); font-size: 0.84rem; }
textarea.input { min-height: 90px; font-size: 0.8rem; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.tabs-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 8px 0 7px; background: none; border: 0; color: var(--muted); font-size: 0.72rem; font-weight: 600; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Toasts */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.toast { pointer-events: auto; max-width: 520px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: toast-in .2s ease-out; }
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; padding: 0; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* Belt-up moment */
.beltup { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.beltup-card { text-align: center; display: grid; gap: 14px; justify-items: center; max-width: 340px; }
.beltup-belt { position: relative; width: 240px; height: 34px; border-radius: 6px; background: var(--belt); border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); animation: tie .7s cubic-bezier(.2,.9,.3,1.2) both; }
.beltup-belt::before, .beltup-belt::after { content: ""; position: absolute; top: 24px; width: 26px; height: 64px; background: var(--belt); border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); border-radius: 4px; }
.beltup-belt::before { left: 92px; transform: rotate(18deg); transform-origin: top; }
.beltup-belt::after { left: 122px; transform: rotate(-14deg); transform-origin: top; }
@keyframes tie { from { transform: scaleX(0.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .beltup-belt { animation: none; } }
.beltup h2 { font-size: 2rem; margin-top: 54px; }

/* Lab */
.lab-chart { width: 100%; height: 240px; display: block; }
.code { background: var(--sunk); border-radius: 10px; padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 0.76rem; line-height: 1.5; white-space: pre; max-height: 360px; }
details > summary { cursor: pointer; font-weight: 600; }
.checklist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.checklist li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; align-items: start; font-size: 0.92rem; }
.checklist .tick { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; margin-top: 2px; }
.checklist .tick.done { background: var(--up); border-color: var(--up); color: var(--on-solid); }
.checklist .tick svg { width: 13px; height: 13px; }
.insight { font-size: 0.95rem; }
.insight p { margin: 0 0 8px; }

.foot { font-size: 0.78rem; color: var(--muted); text-align: center; padding: 6px 8px 0; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 22px 12px; font-size: 0.92rem; }
@media (max-width: 380px) { .kv { grid-template-columns: repeat(2, minmax(0,1fr)); } .hero .big { font-size: 1.9rem; } }

<script>
const PY_SRC = "\"\"\"Dalal Dojo Lab: does market timing beat a plain monthly SIP in the Nifty 50?\n\nEvery strategy gets the same money at the start of each month. Only the timing of\npurchases differs. Uses monthly Nifty 50 closes from Yahoo Finance (^NSEI).\n\n    pip install yfinance pandas matplotlib\n    python dalal_dojo_lab.py --amount 10000 --start 2008 --dip 10 --cash 6\n\nLimits: the Nifty price index leaves out dividends (roughly 1-1.5% a year), and\nno strategy pays charges or tax. Both affect all strategies, so the comparison\nholds, but absolute returns are understated. For dividends, download the\nNifty 50 TRI from niftyindices.com and pass it with --csv (columns Date, Close).\n\"\"\"\nimport argparse\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\n\n\ndef load_monthly(csv=None):\n    if csv:\n        df = pd.read_csv(csv)\n        date_col = next(c for c in df.columns if \"date\" in c.lower())\n        close_col = next(c for c in df.columns if \"close\" in c.lower())\n        s = pd.Series(\n            pd.to_numeric(df[close_col].astype(str).str.replace(\",\", \"\"), errors=\"coerce\").values,\n            index=pd.to_datetime(df[date_col], dayfirst=True, errors=\"coerce\"),\n        ).dropna()\n    else:\n        import yfinance as yf\n        s = yf.download(\"^NSEI\", period=\"max\", interval=\"1mo\", auto_adjust=False, progress=False)[\"Close\"]\n        s = s.squeeze().dropna()\n    s = s.sort_index()\n    return s.groupby(s.index.to_period(\"M\")).last()  # last close of each month\n\n\ndef xirr(months, flows):\n    t = np.asarray(months, dtype=float) / 12.0\n    f = np.asarray(flows, dtype=float)\n    lo, hi = -0.99, 5.0\n    npv = lambda r: np.sum(f / (1 + r) ** t)\n    if npv(lo) * npv(hi) > 0:\n        return float(\"nan\")\n    for _ in range(200):\n        mid = (lo + hi) / 2\n        if npv(lo) * npv(mid) <= 0:\n            hi = mid\n        else:\n            lo = mid\n    return (lo + hi) / 2\n\n\ndef max_drawdown(values):\n    v = np.asarray(values, dtype=float)\n    peak = np.maximum.accumulate(v)\n    return float(np.max((peak - v) / peak))\n\n\ndef backtest(prices, amount, dip, cash_rate, prior_peak=0.0):\n    c = prices.values.astype(float)\n    years = prices.index.year.values\n    n = len(c)\n    rc = (1 + cash_rate / 100) ** (1 / 12) - 1\n    out = {}\n\n    units = np.cumsum(amount / c)\n    out[\"Monthly SIP\"] = units * c\n\n    out[\"Lump sum\"] = (amount * n / c[0]) * c\n\n    cash = np.zeros(n)\n    bal = 0.0\n    for i in range(n):\n        bal = bal * (1 + rc) + amount\n        cash[i] = bal\n    out[\"Cash only\"] = cash\n\n    peak, u, bal, vals, idle = prior_peak, 0.0, 0.0, [], 0\n    for i in range(n):\n        peak = max(peak, c[i])\n        bal = bal * (1 + rc) + amount\n        if c[i] <= peak * (1 - dip / 100):\n            u += bal / c[i]\n            bal = 0.0\n        else:\n            idle += 1\n        vals.append(u * c[i] + bal)\n    out[\"Dip buyer\"] = np.array(vals)\n\n    def timer(best):\n        add_units, waiting = np.zeros(n), np.zeros(n)\n        for i in range(n):\n            end = i\n            while end + 1 < n and years[end + 1] == years[i]:\n                end += 1\n            window = c[i:end + 1]\n            j = i + int(np.argmin(window) if best else np.argmax(window))\n            for k in range(i, j):\n                waiting[k] += amount * (1 + rc) ** (k - i)\n            add_units[j] += amount * (1 + rc) ** (j - i) / c[j]\n        return np.cumsum(add_units) * c + waiting\n\n    out[\"Perfect timer\"] = timer(True)\n    out[\"Worst timer\"] = timer(False)\n\n    months = list(range(n))\n    rows = []\n    for name, v in out.items():\n        if name == \"Lump sum\":\n            r = xirr([0, n - 1], [-amount * n, v[-1]])\n        else:\n            r = xirr(months + [n - 1], [-amount] * n + [v[-1]])\n        rows.append({\"strategy\": name, \"final_value\": v[-1], \"xirr_pct\": 100 * r,\n                     \"worst_fall_pct\": 100 * max_drawdown(v) if name != \"Cash only\" else 0.0})\n    table = pd.DataFrame(rows).set_index(\"strategy\")\n    return out, table, idle\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)\n    ap.add_argument(\"--amount\", type=float, default=10000, help=\"rupees invested each month\")\n    ap.add_argument(\"--start\", type=int, default=None, help=\"first calendar year to include\")\n    ap.add_argument(\"--dip\", type=float, default=10, help=\"dip buyer waits for a fall of this %% from the high\")\n    ap.add_argument(\"--cash\", type=float, default=6, help=\"yearly %% earned by cash waiting to be invested\")\n    ap.add_argument(\"--csv\", default=None, help=\"optional CSV with Date and Close columns\")\n    args = ap.parse_args()\n\n    monthly = load_monthly(args.csv)\n    prior_peak = 0.0\n    if args.start:\n        before = monthly[monthly.index.year < args.start]\n        prior_peak = float(before.max()) if len(before) else 0.0\n        monthly = monthly[monthly.index.year >= args.start]\n    if len(monthly) < 24:\n        raise SystemExit(\"Need at least 24 months of data.\")\n\n    series, table, idle = backtest(monthly, args.amount, args.dip, args.cash, prior_peak)\n    invested = args.amount * len(monthly)\n    pd.set_option(\"display.float_format\", lambda x: f\"{x:,.2f}\")\n    print(f\"{monthly.index[0]} to {monthly.index[-1]}: {len(monthly)} months, Rs {invested:,.0f} invested\\n\")\n    print(table)\n    gap = table.loc[\"Perfect timer\", \"xirr_pct\"] - table.loc[\"Monthly SIP\", \"xirr_pct\"]\n    print(f\"\\nPerfect hindsight added {gap:.2f} points a year over a plain SIP.\")\n    print(f\"The dip buyer had uninvested cash in {idle} of {len(monthly)} months.\")\n\n    x = monthly.index.to_timestamp()\n    fig, ax = plt.subplots(figsize=(10, 5.5))\n    for name, v in series.items():\n        ax.plot(x, v / 1e5, label=name, linewidth=2.4 if name == \"Monthly SIP\" else 1.5)\n    ax.plot(x, args.amount * np.arange(1, len(x) + 1) / 1e5, \"--\", color=\"grey\", label=\"Money put in\")\n    ax.set_ylabel(\"Value (Rs lakh)\")\n    ax.set_title(f\"Rs {args.amount:,.0f} a month into the Nifty 50: does timing help?\")\n    ax.grid(alpha=0.3)\n    ax.legend()\n    fig.tight_layout()\n    fig.savefig(\"dalal_dojo_lab.png\", dpi=150)\n    print(\"\\nSaved chart to dalal_dojo_lab.png\")\n\n\nif __name__ == \"__main__\":\n    main()\n";
</script>

        `John Bogle founded Vanguard and in 1976 launched the first index fund for ordinary investors. His central argument: rather than hunting for the few stocks that will win, own the entire market at the lowest possible cost and hold it.`,
        `The reasoning is arithmetic. All investors together own the whole market, so **before costs** the average rupee invested must earn the market's return. **After costs** (fees, trading, taxes) the average investor has to earn less. The index investor pays the least, so keeps the most.`,

        `An ETF's market price can drift from the value of what it holds. That value, updated live during market hours, is called the **iNAV** (indicative NAV) and is published by the fund house. If the ETF trades at ₹265 while its iNAV is ₹261, buying means paying a premium of about 1.5%.`,

{
  id: "m3",
  title: "Money Foundations",
  blurb: "Emergency fund, insurance, goals, allocation and tax: the groundwork before investing.",
  source: "Introduces personal-finance themes that Monika Halan's Let's Talk Money is known for in India, such as getting the foundations right before chasing returns, written in our own words. Read the book for her full system.",
  links: [{ label: "Let's Talk Money (book)", url: "https://www.google.com/search?q=Let%27s+Talk+Money+Monika+Halan" }, { label: "SEBI investor education", url: "https://investor.sebi.gov.in/" }],
  lessons: [
    {
      id: "m3l1",
      title: "The order of operations",
      mins: 3,
      body: [
        `Investing is the fourth step, not the first.`,
        { list: [
          `**1. A cash buffer.** Know what you spend, and build an emergency fund.`,
          `**2. Insurance.** Health cover for yourself, and term life cover if anyone depends on your income.`,
          `**3. Expensive debt.** Credit-card balances often cost over 30% a year. No investment reliably beats that.`,
          `**4. Investing** for goals.`
        ]},
        `The order matters because without a buffer, a job loss or a hospital bill forces you to sell investments at whatever price the market offers that week, often a bad one.`,
        `A simple structure helps: salary lands in one account, and on payday fixed amounts move automatically to a spending account and to investments. Investing first and spending what's left beats saving whatever is left over.`
      ],
      takeaway: "Buffer, insurance, expensive debt, then investing. Skipping ahead makes every market fall a personal crisis.",
      quiz: [
        { q: "Which comes first?", o: ["Buying stocks", "An emergency fund", "Buying gold", "Trading options"], a: 1, e: "A cash buffer keeps emergencies from forcing you to sell investments at a bad time." },
        { q: "Why pay off a credit-card balance before investing?", o: ["Its interest often exceeds 30% a year", "Banks require it", "It improves market returns", "It isn't necessary"], a: 0, e: "Clearing a 30%+ debt is a guaranteed 30%+ return. No investment offers that reliably." },
        { q: "What does paying yourself first mean?", o: ["Taking a salary advance", "Spending first and saving the remainder", "Moving money to investments on payday, before spending", "Keeping all money in cash"], a: 2, e: "Automating the investment on payday makes saving the default." }
      ]
    },
    {
      id: "m3l2",
      title: "Building the emergency fund",
      mins: 3,
      body: [
        `An emergency fund covers essential expenses if income stops or a big bill arrives. A common guide is **six months of essential spending**: more if your income is irregular or people depend on you, less while you're a student with low fixed costs.`,
        `It must be **safe and quick to reach**:`,
        { list: [
          `A savings account or a sweep-in fixed deposit.`,
          `A liquid mutual fund or liquid ETF, which hold very short-term debt.`,
          `Not shares, equity funds or gold, which can be down 20–40% exactly when you need the money.`
        ]},
        `The emergency fund's job is to be there, not to earn much. A lower return is the price of certainty.`,
        { note: `In this game, LIQUIDBEES stands in for the emergency-fund bucket. The real LIQUIDBEES stays near ₹1,000 and pays its return as extra units. Here it's shown as a slowly rising price to keep things simple.` }
      ],
      takeaway: "Six months of essentials, kept somewhere boring and reachable.",
      quiz: [
        { q: "A common guide for emergency-fund size is:", o: ["One week of spending", "Six months of essential expenses", "Ten years of salary", "Whatever is left at month-end"], a: 1, e: "Around six months of essentials, adjusted for how stable your income is." },
        { q: "Which is a poor place for an emergency fund?", o: ["Savings account", "Liquid fund", "Sweep-in FD", "A small-cap stock"], a: 3, e: "Stocks can fall sharply just when you need the money." },
        { q: "What is the emergency fund's main job?", o: ["Being available when needed", "Earning the highest return", "Saving tax", "Beating inflation by a wide margin"], a: 0, e: "Certainty and access come before returns." }
      ]
    },
    {
      id: "m3l3",
      title: "Insurance is not an investment",
      mins: 4,
      body: [
        `Insurance moves a risk you can't afford onto an insurer. Investing grows money. Mixing the two usually does both badly.`,
        { list: [
          `**Term life insurance** pays only if you die during the term. Premiums are low, so large cover is affordable. A commonly suggested size is 10–15 times your annual income, if someone depends on that income.`,
          `**Health insurance** protects your savings from hospital bills. Employer cover ends when the job does, so a personal policy matters too.`
        ]},
        `**Endowment, money-back and many ULIP policies** combine cover with investment. They tend to offer small cover, high costs, long lock-ins and modest returns. A common alternative is to buy term cover and invest the difference yourself.`,
        `A student with no dependants usually doesn't need life cover yet, but does benefit from health cover.`
      ],
      takeaway: "Buy insurance for protection and investments for growth, separately.",
      quiz: [
        { q: "What does term life insurance do?", o: ["Pays a guaranteed return at maturity", "Pays only if the insured person dies during the term", "Invests in the stock market", "Covers hospital bills"], a: 1, e: "Term cover is pure protection, which is why it's cheap." },
        { q: "Why are endowment-style policies often criticised?", o: ["They are illegal", "They give too much cover", "Small cover, high costs and modest returns", "They can't be cancelled"], a: 2, e: "Mixing cover with investment tends to shortchange both." },
        { q: "Who most needs term life cover?", o: ["Someone whose income others depend on", "A retired person with no dependants", "A child", "Everyone equally"], a: 0, e: "Life cover replaces income for dependants. With no dependants, the need is small." }
      ]
    },
    {
      id: "m3l4",
      title: "Goals and time horizons",
      mins: 3,
      body: [
        `Match each rupee to when you'll need it.`,
        { list: [
          `**Under 3 years** (a laptop, a course fee): fixed deposits, liquid or short-term debt funds. Equity is too unpredictable over this span.`,

          `**7+ years** (retirement, long-term wealth): mostly diversified equity, such as index funds.`
        ]},
        `Equity markets have fallen 30–60% in bad years. Money needed next year shouldn't be exposed to that. Money needed in 15 years has time to recover.`,
        `Write each goal as an **amount and a date**: "₹6 lakh down payment by March 2030" is a goal. "Get rich" isn't.`
      ],
      takeaway: "The date you need the money decides where it should sit.",
      quiz: [
        { q: "Money you need in 18 months is best kept in:", o: ["A small-cap fund", "Fixed deposits or a short-term debt fund", "Gold only", "A single stock"], a: 1, e: "Short horizons can't ride out an equity crash." },
        { q: "Which is a well-defined goal?", o: ["Be comfortable", "Make lots of money", "₹6 lakh by March 2030", "Beat my friends"], a: 2, e: "An amount and a date let you plan the monthly saving and the right product." },
        { q: "Why does a long horizon suit equity?", o: ["There's time to recover from falls", "Equity never falls over long periods", "Tax is zero", "Brokerage is lower"], a: 0, e: "Equity can fall hard, but long horizons have historically given it time to recover." }
      ]
    },
    {
      id: "m3l5",
      title: "Asset allocation and rebalancing",
      mins: 4,
      body: [
        `**Asset allocation** is your split between equity, debt and gold. It decides most of how your portfolio behaves: how far it can fall and how fast it can grow.`,
        `Choose a split you could hold through a crash. An 80% equity portfolio feels fine in a boom. In a 40% market fall it drops about 32%. Ask yourself honestly whether you'd stay put.`,
        `Markets move your mix away from target over time. **Rebalancing** brings it back. The cheapest way is to point new money at whatever is underweight, which avoids sale charges and tax. Selling the overweight part is the fallback when drift is large.`,
        { note: `Set a target allocation in the Portfolio tab. The game then shows your drift and what new money would bring you back to target.` }
      ],
      takeaway: "Pick a mix you'll keep in bad times, then steer back to it with new money.",
      quiz: [
        { q: "An 80% equity portfolio faces a 40% market fall. Roughly how much does the portfolio fall?", o: ["8%", "32%", "40%", "80%"], a: 1, e: "80% × 40% = 32%, assuming the other 20% holds steady." },
        { q: "What's the cheapest way to rebalance?", o: ["Sell everything and rebuy", "Direct new money to the underweight asset", "Trade every day", "Ignore it"], a: 1, e: "Buying the underweight asset needs no sale, so no DP charge and no capital gains tax." },
        { q: "What does asset allocation mainly decide?", o: ["The broker you use", "Your tax slab", "How the portfolio behaves, including how far it can fall", "Which stock wins"], a: 2, e: "The equity, debt and gold mix drives most of the ride." }
      ]
    },
    {
      id: "m3l6",
      title: "Tax on your investments",
      mins: 4,
      body: [
        `India taxes gains when you sell. These were the rates for listed shares, equity funds and ETFs as of 2026:`,
        { list: [
          `**Held more than 12 months (long term):** 12.5% on gains above ₹1.25 lakh in a financial year.`,
          `**Held 12 months or less (short term):** 20%.`,
          `**Gold ETFs:** 12.5% if held more than 12 months, otherwise added to your income at your slab rate.`
        ]},
        `Losses help. Short-term capital losses can be set off against both short- and long-term gains. Long-term losses only against long-term gains. Unused losses carry forward for 8 years if you file your return on time.`,
        `Because tax is charged on selling, a buy-and-hold investor defers tax for years, while a frequent trader pays it every time, at the higher short-term rate.`,
        { note: `Budgets change these rules. Check the current rates on the Income Tax Department's site or with a CA before acting.` }
      ],
      takeaway: "Holding longer than 12 months lowers the rate and lets the first ₹1.25 lakh of yearly long-term equity gains go untaxed.",
      quiz: [
        { q: "You sell equity ETF units after 8 months at a gain. Which rate applies?", o: ["12.5%", "20%", "Slab rate", "0%"], a: 1, e: "12 months or less counts as short term for listed equity: 20%." },
        { q: "Long-term equity gains up to what amount per year are untaxed?", o: ["₹50,000", "₹1.25 lakh", "₹5 lakh", "No limit"], a: 1, e: "The first ₹1.25 lakh of long-term equity gains in a financial year is exempt." },
        { q: "A long-term capital loss can be set off against:", o: ["Long-term gains only", "Salary income", "Any income", "Short-term gains only"], a: 0, e: "Long-term losses offset only long-term gains. Short-term losses can offset both kinds." }
      ]
    }
  ]

{
  id: "m4",
  title: "Your Brain on Markets",
  blurb: "Volatility, loss aversion, tips and leverage: why behaviour matters more than stock picking.",
  source: "Draws on well-documented behavioural research and SEBI data.",
  links: [{ label: "SEBI investor education", url: "https://investor.sebi.gov.in/" }],
  lessons: [
    {
      id: "m4l1",
      title: "Volatility is the price of admission",
      mins: 3,
      body: [
        `Daily swings of 1% in the Nifty are routine. A red "Day's P&L" is the normal texture of owning equities, not a signal.`,
        `Bigger falls happen too. In 2008 the Nifty fell roughly 60% from its peak. In early 2020 it fell almost 40% in about two months. In both cases it later climbed back above its old high: by late 2010 after the 2008 crash, and by late 2020 after the Covid fall.`,
        `**Volatility isn't the same as permanent loss.** For a diversified index, losses become permanent mainly when you sell near the bottom. For a single company, they can become permanent if the business fails.`,
        `Expected returns from equity exist precisely because the ride is uncomfortable. Without volatility there would be no premium for bearing it.`
      ],
      takeaway: "Expect falls of 10–20% every few years and occasionally far worse. Plan for them before they happen.",
      quiz: [
        { q: "Roughly how far did the Nifty fall from peak in 2008?", o: ["About 5%", "About 60%", "About 15%", "It didn't fall"], a: 1, e: "It fell roughly 60% from its early-2008 peak before recovering." },
        { q: "For a diversified index, when do losses usually become permanent?", o: ["When the price dips for a day", "When you sell near the bottom", "Whenever the index is red", "Never"], a: 1, e: "A broad index has historically recovered. Selling at the low turns a temporary fall into a realised loss." },
        { q: "Why does equity offer higher expected returns than a fixed deposit?", o: ["Banks are inefficient", "Investors are paid for bearing the swings", "SEBI guarantees it", "Equity has no risk"], a: 1, e: "The extra return compensates for the discomfort and uncertainty." }
      ]
    },
    {
      id: "m4l2",
      title: "Checking too often",
      mins: 3,
      body: [
        `Look at an equity portfolio daily and you'll see a loss on many of those days. Look once a year and losses show up far less often, because the long-term upward drift has time to outweigh the noise.`,
        `Psychologists Daniel Kahneman and Amos Tversky documented **loss aversion**: a loss feels roughly twice as bad as an equal gain feels good. More looking means more pain, and more pain pushes people to act.`,
        `Acting usually means selling, which brings charges, tax and the risk of missing the recovery.`,
        { list: [
          `Turn off price notifications for long-term holdings.`,
          `Pick review dates and look then.`,
          `Judge the plan on years, not days.`
        ]}
      ],
      takeaway: "The less often you look, the better your decisions tend to be.",
      quiz: [
        { q: "What is loss aversion?", o: ["Avoiding all investments", "Feeling losses more strongly than equal gains", "A tax rule", "A type of order"], a: 1, e: "Losses hurt roughly twice as much as equal gains please, which pushes people to over-react." },
        { q: "Checking a portfolio more often tends to:", o: ["Raise returns", "Show more losses and invite more trading", "Lower charges", "Make no difference to behaviour"], a: 1, e: "Short windows are noisy, so you see more red, and that urges action." },
        { q: "A healthier habit is to:", o: ["Review on scheduled dates", "Check every hour", "Trade on every dip", "Follow social-media tips"], a: 0, e: "Scheduled reviews keep you engaged without reacting to noise." }
      ]
    },
    {
      id: "m4l3",
      title: "Tips, FOMO and F&O",
      mins: 3,
      body: [
        `Futures and options (F&O) let you trade large positions with a small margin. Leverage magnifies gains and losses equally, and the losses come fast.`,
        `SEBI's own studies are blunt. In FY2024-25, **91% of individual traders in equity F&O lost money**. An earlier study found 93% lost money over the three years to FY2024.`,
        `Tips follow the same logic. If someone had a reliable way to know which stock would rise, they wouldn't share it free in a group chat. Many "hot tips" exist so that the person sharing can sell to the people buying.`,
        `**FOMO** (fear of missing out) is strongest after a big rally, exactly when prices are least attractive.`
      ],
      takeaway: "When something promises fast money, ask who's on the other side of the trade.",
      quiz: [
        { q: "Per SEBI's study, what share of individual equity F&O traders lost money in FY2024-25?", o: ["About 10%", "About 50%", "About 91%", "About 25%"], a: 2, e: "SEBI found 91% lost money that year." },
        { q: "What does leverage do?", o: ["Magnifies gains and losses", "Only magnifies gains", "Removes risk", "Lowers charges"], a: 0, e: "Borrowed exposure scales both directions." },
        { q: "When is FOMO usually strongest?", o: ["After a crash", "After a big rally", "On weekends", "When markets are flat"], a: 1, e: "Rising prices create the urge to jump in, often near short-term highs." }
      ]
    },
    {
      id: "m4l4",
      title: "Diversification and position size",
      mins: 3,
      body: [
        `Individual companies can collapse. Yes Bank shares, for example, lost more than 90% of their value between 2018 and 2020. Investors who'd put most of their money into one such stock never recovered that money.`,
        `**Diversification** means no single holding can wreck your plan. An index ETF does this automatically across 50 companies.`,
        `If you do buy individual stocks, many investors cap any one at around 5–10% of the portfolio, so that even a total loss stays survivable.`,

      takeaway: "Size every bet so that being completely wrong is survivable.",
      quiz: [

        { q: "Owning five large-cap funds that hold the same stocks gives you:", o: ["Five times the diversification", "Little extra diversification", "Lower risk than one index fund", "Guaranteed returns"], a: 1, e: "Overlapping holdings mean the same exposure in different wrappers." },
        { q: "A common cap for any single stock is about:", o: ["50%", "5–10% of the portfolio", "100%", "0%"], a: 1, e: "Small position sizes keep a single failure survivable." }
      ]
    },
    {
      id: "m4l5",
      title: "Time in the market vs timing it",
      mins: 3,
      body: [
        `Many of the market's best days arrive close to its worst days, in the middle of panics. An investor who jumps out to avoid the falls often misses the rebounds as well.`,
        `Waiting for the perfect entry has a cost of its own: while cash waits, it earns little and misses the market's growth.`,
        `Studies of US data, such as Charles Schwab's well-known comparison of investors with perfect and terrible timing, found that even perfect timing beat simply investing straight away by a surprisingly small margin. Staying in cash was by far the worst choice.`,
        { note: `Don't take that on trust. The Lab tab lets you test it yourself on Nifty data: a monthly SIP against a dip-buyer, a perfect timer and a worst timer.` }
      ],
      takeaway: "Consistent investing usually beats waiting for the right moment.",
      quiz: [

      const z = i.rho * zm + Math.sqrt(1 - i.rho * i.rho) * gauss();

      r = (Math.log(1 + i.mu) / 250 - 0.5 * i.vol * i.vol + reg) / 375 + (i.vol / Math.sqrt(375)) * z;

  }

  afterPriceUpdate();
  if (S.sim.minute % 10 === 0) save();
}
function endSimDay(silent) {

    const close = sim.px[i.sym];
    sim.hist[i.sym].push(close); if (sim.hist[i.sym].length > 260) sim.hist[i.sym].shift();
    sim.prev[i.sym] = close;
    const gap = i.kind === "liq-etf" ? 0 : gauss() * i.vol * 0.25;

  syncSimP(true);
  processOrders();
  recordCurve(); trackDD(); checkPatience();
  if (!silent) { const ch = (netWorth() - before); toast(`Day ${sim.day - 1} closed. Day ${sim.day} is open.${holdings().length ? " Overnight move " + fmtSigned(ch) + "." : ""}`); }
  save();
}
function simAdvance(days) {
  const sim = S.sim;
  const start = netWorth();
  for (let d = 0; d < days; d++) {
    const frac = d === 0 ? Math.max(0.05, 1 - sim.minute / 375) : 1;
    const zm = gauss() * (Math.random() < 0.05 ? 2.2 : 1);
    for (const i of INSTR) {
      const open = sim.px[i.sym];
      const r = marketDayReturn(i, zm, gauss(), sim.regime.drift) * frac; // first step only covers the rest of today
      const close = round2(Math.max(0.05, open * Math.exp(r)));

  afterPriceUpdate(); render();
}

/* =========================================================
   Accounts, orders, charges
   ========================================================= */
const acct = () => S.acct[S.mode];
function holdings(a = acct()) {
  const out = [];
  for (const [sym, lots] of Object.entries(a.lots)) {
    const q = lots.reduce((s, l) => s + l.q, 0); if (q <= 0) continue;
    const cost = lots.reduce((s, l) => s + l.q * l.p, 0);
    out.push({ sym, q, avg: cost / q, cost });
  }

}
function px(sym) {
  const p = P[sym]; if (p && p.px) return p.px;
  const a = acct(); const n = a.notes.find((x) => x.sym === sym); if (n) return n.price;
  return S.mode === "sim" && S.sim ? S.sim.px[sym] : null;
}
function prevClose(sym) { const p = P[sym]; return p && p.prev ? p.prev : px(sym); }
function netWorth(a = acct()) { return a.cash + holdings(a).reduce((s, h) => s + h.q * (px(h.sym) || h.avg), 0); }
function reserved(a = acct()) { return a.orders.filter((o) => o.status === "open" && o.side === "B").reduce((s, o) => s + o.reserve, 0); }
function available(a = acct()) { return a.cash - reserved(a); }
function dayChange(a = acct()) { return holdings(a).reduce((s, h) => s + h.q * ((px(h.sym) || 0) - (prevClose(h.sym) || 0)), 0); }

function charges(kind, side, value, a, sym, dk) {
  let stt = 0;
  if (kind === "stock") stt = Math.round(value * 0.001);
  else if (kind === "eq-etf" && side === "S") stt = Math.round(value * 0.00001);
  const exch = value * 0.0000297, sebi = value * 0.000001, stamp = side === "B" ? value * 0.00015 : 0;
  const gst = 0.18 * (exch + sebi);
  const dp = side === "S" && a.dp[sym] !== dk ? 15.34 : 0;
  return { brokerage: 0, stt, exch, sebi, stamp, gst, dp, total: round2(stt + exch + sebi + stamp + gst + dp) };
}

function placeOrder(o) {
  const a = acct(), i = BYSYM[o.sym];
  const q = Math.floor(Number(o.qty));
  if (!(q >= 1)) return { ok: false, msg: "Enter a quantity of at least 1." };
  if (o.type === "LMT" && !(o.limit > 0)) return { ok: false, msg: "Enter a limit price above zero." };
  const ltp = px(o.sym);
  if (!ltp) return { ok: false, msg: `There's no price for ${o.sym} yet. Wait for prices to load and try again.` };
  const ref = o.type === "LMT" ? Math.max(o.limit, 0) : ltp;
  let reserve = 0;
  if (o.side === "B") {
    const est = ref * q, ch = charges(i.kind, "B", est, a, o.sym, dayKey());
    reserve = round2(est * (o.type === "MKT" ? 1.01 : 1) + ch.total);
    if (reserve > available(a) + 0.001) return { ok: false, msg: `Not enough cash. This order needs about ${fmtINR(reserve)} and you have ${fmtINR(available(a))} available.` };
  } else {
    const h = holdings(a).find((x) => x.sym === o.sym);
    const pend = a.orders.filter((x) => x.status === "open" && x.side === "S" && x.sym === o.sym).reduce((s, x) => s + x.qty, 0);
    const free = (h ? h.q : 0) - pend;
    if (q > free) return { ok: false, msg: free > 0 ? `You can sell at most ${free} unit${free > 1 ? "s" : ""} of ${o.sym}.` : `You don't hold any ${o.sym} to sell.` };
  }
  const order = { id: "O" + (++a.seq), sym: o.sym, side: o.side, qty: q, type: o.type, limit: o.type === "LMT" ? round2(o.limit) : null, status: "open", placed: stamp(), reserve, amo: !marketOpen() };
  a.orders.unshift(order);
  trimOrders(a);
  let note = null;
  if (!order.amo) {
    if (order.type === "MKT") note = fill(a, order, ltp);
    else if ((order.side === "B" && ltp <= order.limit) || (order.side === "S" && ltp >= order.limit)) note = fill(a, order, ltp);
  }
  save();
  return { ok: true, order, note };
}
function trimOrders(a) {
  const open = a.orders.filter((o) => o.status === "open"), done = a.orders.filter((o) => o.status !== "open").slice(0, 60);
  a.orders = open.concat(done).sort((x, y) => Number(y.id.slice(1)) - Number(x.id.slice(1)));
}
function cancelOrder(id) { const a = acct(); const o = a.orders.find((x) => x.id === id); if (o && o.status === "open") { o.status = "cancelled"; o.reserve = 0; save(); toast(`Cancelled ${o.side === "B" ? "buy" : "sell"} order for ${o.qty} ${o.sym}.`); render(); } }

function fill(a, order, price) {

  let realized = 0, rST = 0, rLT = 0;
  if (order.side === "B") {
    a.cash = round2(a.cash - value - ch.total);
    (a.lots[order.sym] || (a.lots[order.sym] = [])).push(Object.assign({ q: order.qty, p: price }, lotTime()));
  } else {
    let rem = order.qty; const lots = a.lots[order.sym] || [];
    while (rem > 0 && lots.length) {
      const l = lots[0], take = Math.min(rem, l.q), g = (price - l.p) * take;
      realized += g; if (isLongTerm(l)) rLT += g; else rST += g;
      l.q -= take; rem -= take; if (l.q <= 0) lots.shift();

    if (!lots.length) delete a.lots[order.sym];

    a.realized = round2(a.realized + realized); a.rST = round2(a.rST + rST); a.rLT = round2(a.rLT + rLT);

function coachTips(n, a) {

    const share = (n.ch.dp / n.value) * 100;
    if (share >= 2) tips.push(`The flat ₹15.34 DP charge took ${share.toFixed(1)}% of this sale. Small sales lose a bigger share to it.`);
    else tips.push(`The ₹15.34 DP charge applies once per stock per day. Another ${n.sym} sale today won't be charged it again.`);
  }
  if (n.side === "S" && n.ch.dp === 0) tips.push(`No DP charge this time: you already paid it for ${n.sym} today.`);
  if (n.side === "B" && i.kind === "stock") tips.push("Shares pay 0.1% STT on both the buy and the sale. An equity ETF pays 0.001%, and only when you sell.");
  if (n.side === "B" && i.kind === "gold-etf") tips.push("Gold ETFs pay no STT. Gains held over 12 months are taxed at 12.5%; shorter holdings at your slab rate.");
  if (n.amo) tips.push("You placed this while the market was closed, so it waited as an after-market order and filled at the next open.");
  if (n.type === "LMT") tips.push(`Your limit was ${fmtINR(n.limit)}. It filled at ${fmtINR(n.price)} because a limit is the worst price you accept, not the exact price you get.`);
  const today = a.tradesByDay[dayKey()] || 0;
  if (today >= 5) tips.push(`That's ${today} trades today. Every trade adds charges, and frequent trading rarely improves returns.`);
  if (n.side === "S" && n.realized < 0) tips.push(`This sale booked a loss of ${fmtINR(-n.realized)}. In a real account, a capital loss can be set off against capital gains for tax.`);

function beltIndex(xp) { let i = 0; BELTS.forEach((b, k) => { if (xp >= b.xp) i = k; }); return i; }
function addXP(n, why) {

  toast(`+${n} XP · ${why}`);

  save(); renderTop();
}
function award(id) { if (S.ach[id] || !ACH[id]) return; S.ach[id] = Date.now(); addXP(ACH[id].xp, "Badge: " + ACH[id].t); }
function touchStreak() {

  s.count = s.last === istKey(-1) ? s.count + 1 : 1; s.last = k;
  if (s.count >= 3) award("streak3"); if (s.count >= 7) award("streak7");
}

}
function afterTrade(n, a) {

function checkRebalanced() {

  const v = classValues(), tot = v.equity + v.gold + v.debt; if (tot <= 0) return;
  if (["equity", "gold", "debt"].every((k) => Math.abs((v[k] / tot) * 100 - S.target[k]) <= 5)) award("rebalanced");
}

/* Sparklines */
function downsample(vals, n) { if (vals.length <= n) return vals; const out = []; const step = (vals.length - 1) / (n - 1); for (let k = 0; k < n; k++) out.push(vals[Math.round(k * step)]); return out; }
function spark(vals, w, h, colorVar, klass) {
  vals = (vals || []).filter((x) => x != null);
  if (vals.length < 2) return `<svg class="${klass || "spark"}" viewBox="0 0 ${w} ${h}" aria-hidden="true"></svg>`;
  vals = downsample(vals, 80);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1, step = w / (vals.length - 1);
  const pts = vals.map((v, k) => `${(k * step).toFixed(1)},${(h - 2 - ((v - min) / span) * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="${klass || "spark"}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(${colorVar})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function areaChart(vals, base, w, h) {

  if (vals.length < 2) vals = [vals[0] || base, vals[0] || base];
  const all = vals.concat([base]); const min = Math.min(...all), max = Math.max(...all), span = max - min || 1, step = w / (vals.length - 1);
  const y = (v) => (h - 3 - ((v - min) / span) * (h - 6)).toFixed(1);

function practiceData() {
  const rnd = mulberry32(20260419); const g = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const months = []; let c = 3000, crash = 0;
  for (let y = 2006; y <= 2025; y++) for (let m = 1; m <= 12; m++) {
    if (!crash && rnd() < 0.012) crash = 4 + Math.floor(rnd() * 8);
    const drift = crash ? -0.045 : 0.0105; if (crash) crash--;
    c = c * Math.exp(drift + 0.055 * g());
    months.push({ y, m, c: round2(c) });
  }
  return { label: "Practice data (simulated index, 2006–2025)", real: false, months };
}
function parseCSV(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim());
  if (lines.length < 3) throw new Error("The file has too few rows.");
  const split = (l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if ((ch === "," || ch === ";" || ch === "\t") && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map((s) => s.trim()); };
  const head = split(lines[0]).map((h) => h.toLowerCase());
  const di = head.findIndex((h) => h.includes("date"));
  let ci = head.findIndex((h) => h.includes("adj close")); if (ci < 0) ci = head.findIndex((h) => h === "close" || h.startsWith("close")); if (ci < 0) ci = head.findIndex((h) => h.includes("close") || h.includes("price") || h.includes("ltp"));
  if (di < 0 || ci < 0) throw new Error("Couldn't find Date and Close columns. Use a CSV with headers like Date, Close.");
  const mon = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const pd = (s) => {
    s = s.replace(/"/g, "").trim(); let m;

function copyText(text, okMsg) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) { } ta.remove(); toast(ok ? okMsg : "Couldn't copy automatically. Select the text and copy it manually."); };
  try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch (e) { fallback(); }
}
function armConfirm(k) { confirmKey = k; clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { confirmKey = null; if (sheet && sheet.kind === "settings") renderSheet(); }, 4000); renderSheet(); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, arg = t.dataset.arg;

    case "filter": marketFilter = arg; renderView(); break;

    case "range": sheet.range = arg; renderSheet(); break;
    case "order": {

      orderState = { sym, side: arg, qty: arg === "S" && h ? String(h.q) : "1", type: "MKT", limit: String(px(sym) || "") };
      openSheet("order", { sym }); break;
    }
    case "t-side": { orderState.side = arg; const h = holdings().find((x) => x.sym === orderState.sym); if (arg === "S" && h && +orderState.qty > h.q) orderState.qty = String(h.q); renderSheet(); break; }
    case "t-type": orderState.type = arg; if (arg === "LMT" && !(parseFloat(orderState.limit) > 0)) orderState.limit = String(px(orderState.sym) || ""); renderSheet(); break;
    case "t-step": orderState.qty = String(Math.max(1, (parseInt(orderState.qty, 10) || 0) + Number(arg))); $("#t-qty").value = orderState.qty; updateTicket(); break;
    case "t-submit": {
      const o = orderState; const r = placeOrder({ sym: o.sym, side: o.side, qty: o.qty, type: o.type, limit: parseFloat(o.limit) });
      if (!r.ok) { $("#t-err").textContent = r.msg; break; }

      render(); break;
    }
    case "cancel": cancelOrder(arg); break;
    case "note": openSheet("note", { id: arg }); break;

    case "tg-step": { const [k, d] = arg.split(":"); sheet.t[k] = clamp(sheet.t[k] + Number(d), 0, 100); renderSheet(); break; }
    case "tg-save": S.target = Object.assign({}, sheet.t); award("target_set"); checkRebalanced(); save(); closeSheet(); toast("Target saved."); render(); break;

    case "start-cash": {

});

/* Android back button: close a sheet, then go home, then exit. */
window.__onBack = function () {
  if (!$("#beltup").hidden) { $("#beltup").hidden = true; return true; }
  if (sheet) { closeSheet(); return true; }
  if (tab !== "home") { tab = "home"; render(); window.scrollTo(0, 0); return true; }

};
