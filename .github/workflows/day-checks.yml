name: Dinachari checks
on:
  push:
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'day/**', 'llm-from-zero/journey-core.mjs', 'llm-from-zero/clock-core.mjs', '.github/workflows/day-checks.yml']
  pull_request:
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'day/**', 'llm-from-zero/journey-core.mjs', 'llm-from-zero/clock-core.mjs', '.github/workflows/day-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rules, the other apps' data, sync, and the offline cache version
        run: node --test "day/tests/*.test.mjs"
