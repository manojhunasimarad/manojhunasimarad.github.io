<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinachari</title>
<meta name="description" content="Dinachari: one app for the day. Sleep and wake, meals and soaking, study, trading practice, habits and reviews, on top of Kitchen From Zero, LLM From Zero and Dalal Dojo.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/day/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/day/icons/apple-touch-icon.png">
<link rel="preload" href="/day/fonts/AtkinsonHyperlegibleNext.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/day/app.css">
<script>try { var t = (JSON.parse(localStorage.getItem('day.ui')) || {}).theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script type="module" src="/day/app.mjs"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<div class="shell">
  <aside class="side" id="side" aria-label="Dinachari"></aside>
  <header class="top" id="top"><span class="brand"><span class="brand-kn" lang="kn">ದಿನಚರಿ</span><span class="brand-en">Dinachari</span></span></header>
  <main id="main" tabindex="-1">
    <noscript>
      <section class="block">
        <h1>Manoj Hunasimarad</h1>
        <p>Dinachari needs JavaScript. The apps it brings together also open on their own:</p>
        <ul>
          <li><a href="llm-from-zero/">LLM From Zero</a>: a staged study track from Python basics to building language models.</li>
          <li><a href="Kitchen/">Kitchen From Zero</a>: a phone-first meal planner with recipes, nutrition, prep and shopping.</li>
          <li><a href="dalal-dojo/">Dalal Dojo</a>: a paper-trading desk with a simulated NSE session and missions.</li>
          <li><a href="dalal-dojo-lessons/">Dalal Dojo: Lessons and Lab</a>: 24 investing lessons, quizzes and a SIP backtest.</li>
        </ul>
        <p>Code on <a href="https://github.com/manojhunasimarad">GitHub</a>.</p>
      </section>
    </noscript>
    <p class="boot">Opening your day…</p>
  </main>
  <div class="timers" id="timers" aria-live="polite"></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<dialog id="sheet" class="sheet" aria-label="Details"><form id="sheet-form" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
