<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dalal Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a trading desk. Watchlist rail | chart + market depth | coach rail, with the order blotter under the chart. */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel-2:#edf0f5; --line:#dce2ea; --line-2:#c9d1dc;
  --fg:#131b25; --muted:#586577; --faint:#8592a3;
  --accent:#b86a00; --accent-soft:#fcefd8; --accent-fg:#ffffff;
  --buy:#1f5fdc; --buy-soft:#e4ecfc; --sell:#d6431f; --sell-soft:#fce7e1; --on-trade:#ffffff;
  --up:#0d8a53; --down:#cc3340; --up-soft:#dff3ea; --down-soft:#fbe4e6;
  --focus:#1f5fdc; --scrim:rgba(15,22,32,.38); --shadow:0 18px 50px rgba(18,28,40,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-ui:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1016; --panel:#111821; --panel-2:#18212c; --line:#222d3a; --line-2:#2e3b4b;
  --fg:#e4eaf1; --muted:#8e9cae; --faint:#5e6c7e;
  --accent:#f1a83a; --accent-soft:#2a2113; --accent-fg:#1a1206;
  --buy:#5a94ff; --buy-soft:#13213a; --sell:#ff7356; --sell-soft:#381a13; --on-trade:#08101c;
  --up:#2fc985; --down:#ff5c67; --up-soft:#10291f; --down-soft:#341519;
  --focus:#5a94ff; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1016; --panel:#111821; --panel-2:#18212c; --line:#222d3a; --line-2:#2e3b4b;
  --fg:#e4eaf1; --muted:#8e9cae; --faint:#5e6c7e;
  --accent:#f1a83a; --accent-soft:#2a2113; --accent-fg:#1a1206;
  --buy:#5a94ff; --buy-soft:#13213a; --sell:#ff7356; --sell-soft:#381a13; --on-trade:#08101c;
  --up:#2fc985; --down:#ff5c67; --up-soft:#10291f; --down-soft:#341519;
  --focus:#5a94ff; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px}
.topbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-block:9px}
.brand{display:flex;align-items:center;gap:9px;font:800 19px/1 var(--f-display);letter-spacing:-.025em;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand small{font:600 10px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:3px 6px;border:1px solid var(--line-2);border-radius:4px}
.idx{display:flex;flex-direction:column;gap:1px;white-space:nowrap;padding-left:14px;border-left:1px solid var(--line)}
.idx .row{display:flex;gap:7px;align-items:baseline}
.idx b{font:600 14px/1.1 var(--f-num)}
.idx .chg{font:500 11.5px/1 var(--f-num)}
.spacer{flex:1}
.modepill{display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line-2);border-radius:999px;font-weight:600;font-size:12px;white-space:nowrap}
.modepill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.modepill[data-mode="live"] .dot{background:var(--up);box-shadow:0 0 0 3px var(--up-soft)}
.modepill:hover{background:var(--panel-2)}
.clock{display:flex;align-items:center;gap:8px;white-space:nowrap}
.clock b{font:600 16px/1 var(--f-num)}
.phase{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.phase[data-p="open"]{background:var(--up-soft);color:var(--up)}
.phase[data-p="pre"],.phase[data-p="closing"]{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted);border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:var(--r);font-weight:650;font-size:13px;border:1px solid var(--line-2);background:var(--panel);white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.buy{background:var(--buy);border-color:var(--buy);color:var(--on-trade)}
.btn.sell{background:var(--sell);border-color:var(--sell);color:var(--on-trade)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rank{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;row-gap:3px;align-items:center;white-space:nowrap;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.rank .xpbar{grid-column:2}
.rank .lv{grid-row:1/4;font:800 15px/1 var(--f-display);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border:1.5px solid var(--accent)}
.rank .name{font-weight:700;font-size:12.5px}
.xpbar{height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;transition:width .4s}
.rank .xp{font:500 10.5px/1 var(--f-num);color:var(--muted);grid-column:2;margin-top:3px}

.desk{flex:1;min-height:0;display:grid;grid-template-columns:268px minmax(0,1fr) 318px;grid-template-rows:minmax(0,1fr) minmax(220px,34%);gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;min-height:0}
.watch{grid-column:1;grid-row:1/3;display:flex;flex-direction:column}
.center{grid-column:2;grid-row:1;display:flex;flex-direction:column}
.coach{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;overflow:hidden}
.blotter{grid-column:2;grid-row:2;display:flex;flex-direction:column}

/* ---------- watchlist ---------- */
.wl-head{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.wl-head input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2)}
.wl{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.wl li{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.wl li:hover,.wl li[aria-selected="true"]{background:var(--panel-2)}
.wl li[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.wl .s{font-weight:650;font-size:12.5px;letter-spacing:.01em}
.wl .s.idx-s{color:var(--muted)}
.wl .n{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .p{font:500 12.5px/1.2 var(--f-num);text-align:right;transition:color .25s}
.wl .c{font:500 11px/1.2 var(--f-num);text-align:right}
.wl .acts{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;gap:4px}
.wl li:hover .acts,.wl li:focus-within .acts{display:flex}
.wl .acts button{width:26px;height:24px;border-radius:4px;font-weight:700;font-size:12px;color:var(--on-trade)}
.wl .acts .b{background:var(--buy)} .wl .acts .x{background:var(--sell)}
.flash-up{color:var(--up)!important} .flash-down{color:var(--down)!important}
.wl-foot{padding:8px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}

/* ---------- center ---------- */
.symhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 12px;border-bottom:1px solid var(--line)}
.symhead h1{margin:0;font:700 20px/1 var(--f-display);letter-spacing:-.02em}
.symhead .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.symhead .ltp{font:600 20px/1 var(--f-num)}
.symhead .ltpchg{font:500 12px/1 var(--f-num);margin-top:3px}
.ohlc{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px}
.ohlc span b{font:500 11.5px var(--f-num);color:var(--fg);margin-left:3px}
.ohlc span{color:var(--muted)}
.symhead .acts{display:flex;gap:6px;margin-left:auto;align-items:center}
.chartwrap{position:relative;flex:1;min-height:220px}
.chartwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.depthrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr);gap:0;border-top:1px solid var(--line)}
.depth{width:100%;border-collapse:collapse;font:500 11.5px/1.25 var(--f-num)}
.depth th{font:600 10px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;text-align:right}
.depth th:first-child,.depth td:first-child{text-align:left}
.depth td{padding:2.5px 10px;text-align:right;position:relative}
.depth .bidp{color:var(--buy)} .depth .askp{color:var(--sell)}
.depth tr.tot td{border-top:1px solid var(--line);padding-top:5px;color:var(--muted)}
.depth td .bar{position:absolute;top:2px;bottom:2px;right:0;opacity:.13;border-radius:2px}
.depthcol{padding:4px 0 6px;border-right:1px solid var(--line);min-width:0;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:4px 14px;padding:8px 12px;font-size:11.5px;align-content:start}
.stats div{display:flex;justify-content:space-between;gap:6px;min-width:0}
.stats span{color:var(--muted);white-space:nowrap}
.stats b{font:500 11.5px var(--f-num);white-space:nowrap}

/* ---------- blotter ---------- */
.tabs{display:flex;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{padding:9px 10px 8px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .ct{font:600 10.5px var(--f-num);margin-left:5px;padding:1px 5px;border-radius:8px;background:var(--panel-2);color:var(--muted)}
.tabbody{flex:1;overflow:auto;min-height:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;background:var(--panel);font:600 10px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font:700 10px/1.2 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;background:var(--panel-2);color:var(--muted)}
.tag.buy{background:var(--buy-soft);color:var(--buy)} .tag.sell{background:var(--sell-soft);color:var(--sell)}
.tag.ok{background:var(--up-soft);color:var(--up)} .tag.bad{background:var(--down-soft);color:var(--down)} .tag.wait{background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);max-width:52ch;margin:0 auto}
.empty b{display:block;color:var(--fg);font:700 14px/1.3 var(--f-display);margin-bottom:4px}
.rowacts{display:inline-flex;gap:4px}
.reason{display:block;font-size:11px;color:var(--down);white-space:normal;max-width:44ch;text-align:left;margin-top:2px}
.funds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0}
.funds section{padding:12px 14px;border-right:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px}
.kv span{color:var(--muted)} .kv b{font:500 12.5px var(--f-num)}
.kv.big b{font:700 18px var(--f-num)}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.jnote{width:100%;min-width:160px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);font-size:12px}
.jsel{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;padding:6px 10px}
.bars i{flex:1;max-width:18px;border-radius:2px 2px 0 0;min-height:2px}

/* ---------- coach ---------- */
.coachhead{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.coachhead .lvl{font:700 15px/1.2 var(--f-display);letter-spacing:-.01em;margin-top:2px}
.lvlprog{display:flex;gap:3px;margin-top:9px}
.lvlprog i{flex:1;height:4px;border-radius:2px;background:var(--panel-2)}
.lvlprog i.done{background:var(--accent)}
.mcard{padding:12px 14px;border-bottom:1px solid var(--line)}
.mcard h2{margin:2px 0 6px;font:700 16px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.mcard .how{font-size:12.5px;margin:0 0 8px}
.mcard .concept{font-size:12px;color:var(--muted);margin:0;padding:8px 10px;background:var(--panel-2);border-radius:var(--r)}
.mcard .xpchip{font:600 10.5px var(--f-num);color:var(--accent)}
.quiz{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.quiz .q{font-size:12.5px;font-weight:600}
.quiz button{text-align:left;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r);font:500 12.5px var(--f-num)}
.quiz button:hover{background:var(--panel-2)}
.quiz button.wrong{border-color:var(--down);color:var(--down)}
.mlist{list-style:none;margin:0;padding:6px 8px;border-bottom:1px solid var(--line)}
.mlist li{display:flex;gap:9px;align-items:center;padding:5px 6px;border-radius:4px;font-size:12.5px}
.mlist li.cur{background:var(--panel-2);font-weight:650}
.mlist .chk{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.mlist li.done .chk{background:var(--accent);border-color:var(--accent)}
.mlist li.done .chk::after{content:"";width:6px;height:3.5px;border:solid var(--accent-fg);border-width:0 0 1.6px 1.6px;transform:rotate(-45deg) translate(0,-1px)}
.mlist li.done span{color:var(--muted)}
.mlist .x{margin-left:auto;font:500 10.5px var(--f-num);color:var(--faint)}
.feedh{display:flex;justify-content:space-between;align-items:center;padding:9px 14px 5px}
.feed{list-style:none;margin:0;padding:0 8px 10px;overflow:auto;flex:1;min-height:80px}
.feed li{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:5px 6px;font-size:12px;border-radius:4px}
.feed li time{font:500 10.5px/1.6 var(--f-num);color:var(--faint)}
.feed li.k-news{background:var(--accent-soft)}
.feed li.k-bad span{color:var(--down)}
.feed li.k-good span{color:var(--up)}
.feed li.k-coach span{font-weight:600}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.ticket{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:50;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.thead{padding:14px 16px;color:var(--on-trade);display:flex;align-items:center;gap:10px}
.thead.buy{background:var(--buy)} .thead.sell{background:var(--sell)}
.thead h2{margin:0;font:700 17px/1.1 var(--f-display)}
.thead .sub{font:500 12px var(--f-num);opacity:.9;margin-top:3px}
.thead .flip{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.switch{width:38px;height:22px;border-radius:11px;background:color-mix(in srgb, var(--on-trade) 30%, transparent);position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--on-trade);transition:transform .15s}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.thead .close{color:var(--on-trade);font-size:22px;line-height:1;padding:2px 6px;opacity:.85}
.tbody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r);font-size:12.5px;font-weight:600;cursor:pointer}
.radios input{accent-color:var(--fg)}
.radios label:has(input:checked){border-color:var(--fg);background:var(--panel-2)}
.radios label:has(input:disabled){opacity:.4;cursor:not-allowed}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{width:100%;padding:8px 9px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);font:500 14px var(--f-num)}
.field input:disabled{background:var(--panel-2);color:var(--faint)}
.risk{border:1px dashed var(--line-2);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.risk .rr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.risk .rr span{color:var(--muted)} .risk .rr b{font:500 12px var(--f-num);text-align:right}
.risk .line{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.risk .line .field{flex:1;min-width:120px}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:12px}
.chk input{margin-top:2px;accent-color:var(--accent)}
.tsum{display:flex;flex-direction:column;gap:2px}
.tmsg{min-height:18px;margin:0;font-size:12px}
.tmsg.err{color:var(--down)} .tmsg.ok{color:var(--up)}
.tfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.tfoot .btn{flex:1;padding:10px}
.dialog{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.dialog header{padding:16px 18px 6px}
.dialog h2{margin:0;font:800 22px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.dialog .body{padding:6px 18px 16px;display:flex;flex-direction:column;gap:10px}
.dialog footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modeopt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;border:1px solid var(--line-2);border-radius:8px;text-align:left;width:100%}
.modeopt:hover:not(:disabled){background:var(--panel-2)}
.modeopt:disabled{cursor:default;opacity:.75}
.modeopt .ic{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:800 13px var(--f-display)}
.modeopt b{font:700 14px var(--f-display)}
.modeopt p{margin:0;font-size:12px;color:var(--muted)}
.code{font:500 12px/1.6 var(--f-num);background:var(--panel-2);border-radius:6px;padding:9px 11px;white-space:pre-wrap;word-break:break-all;user-select:all}
.daylist{display:flex;gap:6px;flex-wrap:wrap}
.bigpnl{font:800 34px/1 var(--f-num);letter-spacing:-.02em}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 18px}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:12.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .desk{grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(560px,auto) auto auto}
  .watch{grid-row:1/3}
  .blotter{grid-column:2;grid-row:2;min-height:300px}
  .coach{grid-column:1/3;grid-row:3;max-height:none}
  .feed{max-height:260px}
}
@media (max-width:760px){
  .desk{display:flex;flex-direction:column}
  .watch{max-height:330px}
  .chartwrap{min-height:260px;flex:none;height:260px}
  .depthrow{grid-template-columns:1fr 1fr}
  .stats{grid-column:1/3;border-top:1px solid var(--line)}
  .depthcol:nth-child(2){border-right:0}
  .idx{border-left:0;padding-left:0}
  .fields{grid-template-columns:1fr 1fr}
  .ticket{top:auto;width:100%;max-height:92%;border-radius:12px 12px 0 0;padding-right:0}
  .thead{border-radius:12px 12px 0 0}
  .wl li:hover .acts,.wl li:focus-within .acts{display:none}
}

<script>
(() => {
'use strict';

/* ======================================================================
   Utilities
   ====================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const NF2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const f2 = x => (x == null || !isFinite(x)) ? '—' : NF2.format(x);
const f0 = x => (x == null || !isFinite(x)) ? '—' : NF0.format(x);
const rs = x => (x == null || !isFinite(x)) ? '—' : (x < 0 ? '−₹' : '₹') + NF2.format(Math.abs(x));
const sg = x => (x == null || !isFinite(x)) ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + NF2.format(Math.abs(x));
const pc = x => (x == null || !isFinite(x)) ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(2) + '%';
const cls = x => x > 0 ? 'up' : x < 0 ? 'down' : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = x => Math.round(x * 100) / 100;
const vol0 = v => v >= 1e7 ? (v / 1e7).toFixed(2) + ' Cr' : v >= 1e5 ? (v / 1e5).toFixed(2) + ' L' : f0(v);

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32((Date.now() ^ 0x9e3779b9) >>> 0);
function gauss() { let u = 0, v = 0; while (u === 0) u = rand(); while (v === 0) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* NSE cash-segment tick sizes (price bands effective 15 Apr 2025). Set per stock from the previous close. */
function tickFor(price, kind) {
  if (kind === 'index') return 0.05;
  if (price < 250) return 0.01;
  if (price <= 1000) return 0.05;
  if (price <= 5000) return 0.10;
  if (price <= 10000) return 0.50;
  if (price <= 20000) return 1.00;
  return 5.00;
}
const roundT = (p, t) => +(Math.round(p / t) * t).toFixed(2);
const floorT = (p, t) => +(Math.floor(p / t + 1e-9) * t).toFixed(2);
const ceilT = (p, t) => +(Math.ceil(p / t - 1e-9) * t).toFixed(2);
const onTick = (p, t) => Math.abs(p / t - Math.round(p / t)) < 1e-6;
const tickDec = t => t < 0.05 ? 2 : 2;

/* Market clock (IST seconds after midnight) */
const T_PRE = 9 * 3600, T_IEP = 9 * 3600 + 8 * 60, T_OPEN = 9 * 3600 + 15 * 60, T_WARN = 15 * 3600 + 15 * 60, T_SQ = 15 * 3600 + 25 * 60, T_CLOSE = 15 * 3600 + 30 * 60;
const DAY_S = T_CLOSE - T_OPEN; // 22,500 trading seconds
const SEC_YEAR = 250 * DAY_S;
const hms = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`; };
const hm = s => hms(s).slice(0, 5);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dParse = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); };
const dFmt = d => { const x = dParse(d); return `${DOW[x.getUTCDay()]} ${x.getUTCDate()} ${MON[x.getUTCMonth()]}`; };
const dIso = x => x.toISOString().slice(0, 10);
function nextWeekday(d) { const x = dParse(d); do { x.setUTCDate(x.getUTCDate() + 1); } while (x.getUTCDay() === 0 || x.getUTCDay() === 6); return dIso(x); }
function prevWeekday(d) { const x = dParse(d); do { x.setUTCDate(x.getUTCDate() - 1); } while (x.getUTCDay() === 0 || x.getUTCDay() === 6); return dIso(x); }
const chartTime = (d, sec) => dParse(d).getTime() / 1000 + sec;
function phaseOf(sec) { if (sec < T_PRE) return 'closed'; if (sec < T_OPEN) return 'pre'; if (sec < T_SQ) return 'open'; if (sec < T_CLOSE) return 'closing'; return 'closed'; }
const PHASE_LABEL = { closed: 'Closed', pre: 'Pre-open', open: 'Open', closing: 'Closing' };
function curPhase() { if (!feed || !feed.started) return 'closed'; if (feed.mode === 'live' && feed.marketOpen === false) return 'closed'; return phaseOf(feed.sec); }

/* ======================================================================
   Instruments. Starting prices are approximate late-Sep to Oct 2026 levels
   (NIFTY 50 closed at 22,600 on 23 Oct 2026). The practice market is a
   simulation; live quotes come from the companion app.
   ====================================================================== */
const UNIVERSE = [
  { sym: 'NIFTY 50', name: 'Nifty 50 index', kind: 'index', sector: 'Index', prev: 22600.00, beta: 1, vol: 0.16, adv: 0 },
  { sym: 'NIFTY BANK', name: 'Nifty Bank index', kind: 'index', sector: 'Banks', prev: 55400.00, beta: 1.12, vol: 0.19, adv: 0 },
  { sym: 'NIFTYBEES', name: 'Nifty 50 ETF (BeES)', kind: 'etf', sector: 'ETF', prev: 254.20, beta: 1, vol: 0.16, adv: 6e6, spread: 1.2 },
  { sym: 'RELIANCE', name: 'Reliance Industries', kind: 'eq', sector: 'Energy', prev: 1224.70, beta: 1.0, vol: 0.24, adv: 9e6 },
  { sym: 'HDFCBANK', name: 'HDFC Bank', kind: 'eq', sector: 'Banks', prev: 735.40, beta: 0.9, vol: 0.22, adv: 18e6 },
  { sym: 'ICICIBANK', name: 'ICICI Bank', kind: 'eq', sector: 'Banks', prev: 1394.20, beta: 1.05, vol: 0.24, adv: 11e6 },
  { sym: 'SBIN', name: 'State Bank of India', kind: 'eq', sector: 'Banks', prev: 958.60, beta: 1.25, vol: 0.28, adv: 12e6 },
  { sym: 'INFY', name: 'Infosys', kind: 'eq', sector: 'IT', prev: 1153.80, beta: 0.75, vol: 0.28, adv: 7e6 },
  { sym: 'TCS', name: 'Tata Consultancy Services', kind: 'eq', sector: 'IT', prev: 2080.50, beta: 0.7, vol: 0.24, adv: 2.5e6 },
  { sym: 'ITC', name: 'ITC', kind: 'eq', sector: 'FMCG', prev: 268.90, beta: 0.6, vol: 0.20, adv: 14e6 },
  { sym: 'LT', name: 'Larsen & Toubro', kind: 'eq', sector: 'Infra', prev: 3878.00, beta: 1.1, vol: 0.25, adv: 1.8e6 },
  { sym: 'BHARTIARTL', name: 'Bharti Airtel', kind: 'eq', sector: 'Telecom', prev: 1867.50, beta: 0.75, vol: 0.24, adv: 5e6 },
  { sym: 'TATASTEEL', name: 'Tata Steel', kind: 'eq', sector: 'Metals', prev: 174.04, beta: 1.4, vol: 0.36, adv: 28e6 },
  { sym: 'ETERNAL', name: 'Eternal (Zomato)', kind: 'eq', sector: 'Consumer tech', prev: 317.40, beta: 1.35, vol: 0.45, adv: 35e6 },
  { sym: 'MARUTI', name: 'Maruti Suzuki', kind: 'eq', sector: 'Auto', prev: 12071.00, beta: 0.9, vol: 0.25, adv: 4.5e5 },
];
const BYSYM = Object.fromEntries(UNIVERSE.map(u => [u.sym, u]));
const TRADABLE = UNIVERSE.filter(u => u.kind !== 'index').map(u => u.sym);

/* ======================================================================
   Charges (Zerodha's published equity rates, Oct 2026)
   ====================================================================== */
const RATE = {
  brokPct: 0.0003, brokCap: 20,            // intraday: 0.03% or ₹20 per executed order, whichever is lower; delivery: zero
  sttIntraSell: 0.00025, sttDel: 0.001,     // STT: 0.025% sell side intraday; 0.1% buy and sell delivery
  txn: 0.0000307,                           // NSE transaction charge 0.00307%
  sebi: 0.000001,                           // ₹10 per crore
  stampIntra: 0.00003, stampDel: 0.00015,   // stamp duty, buy side
  gst: 0.18,                                // on brokerage + SEBI + transaction charges
  dp: 15.34,                                // per scrip per day when selling from holdings
  autoSq: 50,                               // per order squared off by the broker, plus GST
};
const MIS_MARGIN = 0.20;                    // up to 5x leverage for intraday equity
function charges(side, value, delivery) {
  const brokerage = delivery ? 0 : Math.min(RATE.brokCap, value * RATE.brokPct);
  const stt = delivery ? value * RATE.sttDel : (side === 'SELL' ? value * RATE.sttIntraSell : 0);
  const txn = value * RATE.txn, sebi = value * RATE.sebi;
  const stamp = side === 'BUY' ? value * (delivery ? RATE.stampDel : RATE.stampIntra) : 0;
  const gst = (brokerage + txn + sebi) * RATE.gst;
  return { brokerage, stt, txn, sebi, stamp, gst, dp: 0, autosq: 0, total: brokerage + stt + txn + sebi + stamp + gst };
}
const addCh = (a, b) => { for (const k of Object.keys(b)) a[k] = (a[k] || 0) + b[k]; return a; };
const zeroCh = () => ({ brokerage: 0, stt: 0, txn: 0, sebi: 0, stamp: 0, gst: 0, dp: 0, autosq: 0, total: 0 });

/* ======================================================================
   Practice market: a simulated NSE session.
   Index factor + sector factors + stock noise, a U-shaped intraday
   volatility curve, slow drift regimes (trend vs range days), opening
   gaps, and occasional simulated news shocks.
   ====================================================================== */
const sigSec = v => v / Math.sqrt(SEC_YEAR);
const SIG_M = 0.16;
function volShape(sec) { const m = (sec - T_OPEN) / 60; return (0.72 + 1.15 * Math.exp(-m / 22) + 0.55 * Math.exp(-(375 - m) / 28)) / 0.83; }
const NEWS = [
  { scope: 'sym', dir: 1, t: s => `Large block deal in ${s}; buyers absorb the supply` },
  { scope: 'sym', dir: -1, t: s => `Heavy selling in ${s} after a big block crosses below the market` },
  { scope: 'sym', dir: 1, t: s => `A brokerage upgrades ${s} and raises its target` },
  { scope: 'sym', dir: -1, t: s => `A brokerage downgrades ${s} on valuation` },
  { scope: 'sector', key: 'Banks', dir: 1, t: () => 'Bank stocks rally on hopes of a rate cut' },
  { scope: 'sector', key: 'Banks', dir: -1, t: () => 'Banks slip as bond yields rise' },
  { scope: 'sector', key: 'IT', dir: 1, t: () => 'IT stocks gain as the rupee weakens against the dollar' },
  { scope: 'sector', key: 'IT', dir: -1, t: () => 'IT stocks fall on weak US tech cues' },
  { scope: 'sector', key: 'Metals', dir: 1, t: () => 'Metal stocks climb on firm global prices' },
  { scope: 'market', dir: -1, t: () => 'Crude oil jumps again; the broad market comes under pressure' },
  { scope: 'market', dir: 1, t: () => 'Foreign investors turn net buyers; buying across sectors' },
];

function mkInst(u, prev) {
  const kind = u.kind;
  const tick = tickFor(prev, kind);
  const sig = sigSec(u.vol);
  return {
    sym: u.sym, name: u.name, kind, sector: u.sector, beta: u.beta, volA: u.vol, adv: u.adv, spreadBps: u.spread || 1.4,
    prev, tick, p: prev, ltp: prev, open: null, high: null, low: null, volume: 0, ltq: 0, ltt: null,
    bid: kind === 'index' ? null : floorT(prev - tick, tick), ask: kind === 'index' ? null : ceilT(prev + tick, tick),
    lower: roundT(prev * 0.9, tick), upper: roundT(prev * 1.1, tick),
    candles: [], prevCandles: [], pv: 0, vv: 0, vwap: null,
    sig, idio: sigSec(Math.sqrt(Math.max(0.0036, u.vol * u.vol - (u.beta * SIG_M) ** 2))),
    drift: 0, bias: 0, jv: 1, iep: null, depth: null, depthAt: -1,
  };
}

class SimFeed {
  constructor(date, closes, prevFeed) {
    this.mode = 'sim'; this.date = date; this.sec = T_PRE; this.started = false;
    this.inst = {};
    for (const u of UNIVERSE) this.inst[u.sym] = mkInst(u, closes[u.sym] ?? u.prev);
    this.m = { drift: 0, bias: 0, jv: 1 };
    this.beesRatio = this.inst.NIFTYBEES.prev / this.inst['NIFTY 50'].prev; this.te = 0;
    this.news = []; this.events = [];
    if (prevFeed && prevFeed.mode === 'sim' && Object.values(prevFeed.inst).every(I => I.candles && I.candles.length > 30)) {
      // Yesterday on the chart is the day you just traded.
      for (const s in this.inst) { const P = prevFeed.inst[s], I = this.inst[s]; I.prevCandles = P.candles.map(c => ({ ...c })); I.prevHigh = P.high; I.prevLow = P.low; }
    } else this.genPrevDay();
  }
  // Previous session's 1-minute candles, scaled to end exactly at the previous close.
  genPrevDay() {
    const pd = prevWeekday(this.date);
    const xs = {}; let xm = 0; const md = { d: 0 };
    for (const s in this.inst) xs[s] = { x: 0, d: 0, path: [] };
    for (let m = 0; m < 375; m++) {
      const sec0 = T_OPEN + m * 60, f = volShape(sec0 + 30);
      md.d = md.d * 0.97 + 0.002 * sigSec(SIG_M) * gauss();

      I.ltt = T_OPEN;

}

/* Replay: a real past session from the companion app, revealed minute by minute.
   Inside each 1-minute candle the price walks open → high/low → low/high → close. */
class ReplayFeed {
  constructor(day) {
    this.mode = 'replay'; this.date = day.date; this.sec = T_PRE; this.started = false; this.events = []; this.inst = {};
    for (const u of UNIVERSE) {
      const d = day.instruments[u.sym]; if (!d || !d.candles || !d.candles.length) continue;
      const I = mkInst(u, d.prev_close || d.candles[0][1]);
      I.src = d.candles.map(([t, o, h, l, c, v]) => ({ t, o, h, l, c, v, hf: rand() < 0.5 }));
      I.byMin = new Map(I.src.map(k => [k.t, k]));
      if (d.prev_candles && d.prev_candles.length) {
        I.prevCandles = d.prev_candles.map(([t, o, h, l, c, v]) => ({ time: chartTime(day.prev_date || prevWeekday(day.date), t), open: o, high: h, low: l, close: c, volume: v }));
        I.prevHigh = Math.max(...I.prevCandles.map(c => c.high)); I.prevLow = Math.min(...I.prevCandles.map(c => c.low));
      }
      this.inst[u.sym] = I;
    }
  }
  start() { this.started = true; for (const s in this.inst) { const I = this.inst[s]; I.iep = I.src[0].o; } }
  priceAt(k, frac) {
    const a = k.hf ? k.h : k.l, b = k.hf ? k.l : k.h;
    const pts = [[0, k.o], [0.32, a], [0.68, b], [1, k.c]];
    for (let i = 1; i < pts.length; i++) if (frac <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (frac - x0) / (x1 - x0); }
    return k.c;
  }
  step() {
    this.sec++; const sec = this.sec;
    if (sec < T_OPEN || sec > T_CLOSE) return;
    const mStart = sec - (sec - T_OPEN) % 60, frac = ((sec - T_OPEN) % 60) / 60;
    const minuteT = chartTime(this.date, mStart);
    for (const s in this.inst) {
      const I = this.inst[s]; const k = I.byMin.get(mStart); if (!k) continue;
      let p = this.priceAt(k, frac) + (frac > 0 && frac < 1 ? gauss() * I.tick * 0.6 : 0);
      p = clamp(p, k.l, k.h);
      I.p = p; const px = roundT(p, I.tick);
      if (I.open == null) { I.open = k.o; I.high = k.o; I.low = k.o; }
      const v = Math.round(k.v / 60 * Math.exp(0.5 * gauss() - 0.125));
      if (I.kind !== 'index') {
        const half = Math.max(I.tick * 0.5, p * I.spreadBps / 2e4);
        I.bid = floorT(p - half, I.tick); I.ask = ceilT(p + half, I.tick); if (I.ask - I.bid < I.tick - 1e-9) I.ask = +(I.bid + I.tick).toFixed(2);
        if (v > 0) { I.volume += v; I.ltq = v; I.pv += px * v; I.vv += v; I.vwap = I.pv / I.vv; }
      }
      I.ltp = px; I.ltt = sec; I.high = Math.max(I.high, px); I.low = Math.min(I.low, px);
      const last = I.candles[I.candles.length - 1];
      if (!last || last.time !== minuteT) I.candles.push({ time: minuteT, open: px, high: px, low: px, close: px, volume: Math.max(0, v), vw: I.vwap ?? px });
      else { last.high = Math.max(last.high, px); last.low = Math.min(last.low, px); last.close = px; last.volume += Math.max(0, v); last.vw = I.vwap ?? px; }
    }
  }
  openMarket() { }
}

function depthOf(I, now) {
  if (I.kind === 'index' || I.bid == null) return null;
  if (I.depth && I.depth.real) return I.depth;
  if (I.depth && I.depthAt === now) return I.depth;
  const lq = Math.max(8, I.adv / DAY_S * 22);
  const lvl = (p0, dir) => { const out = []; for (let i = 0; i < 5; i++) { const q = Math.max(1, Math.round(lq * (1 + 0.35 * i) * Math.exp(0.55 * gauss()))); out.push([+(p0 + dir * i * I.tick).toFixed(2), q, Math.max(1, Math.round(q / (lq / 7) * (0.6 + rand() * 0.8)))]); } return out; };
  I.depth = { bids: lvl(I.bid, -1), asks: lvl(I.ask, 1) }; I.depthAt = now;
  return I.depth;
}

/* ======================================================================
   Account state (persisted). One document per viewer.
   ====================================================================== */

  return {

    xp: 0, missions: {}, journaledIds: [], exports: 0,
    trips: [], history: [], lastCloses: {}, nextDate: FIRST_DATE, speed: 20,
    seq: 1, day: null,

}
let A = freshAccount();
let feed = null;

let selected = 'RELIANCE';
let tab = 'positions';
let tf = 1;
let speed = 20;
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

    startWorth: null, peak: null, maxDD: 0, tripsClosed: 0, xp0: A.xp, lastPrices: {}, noStopWarned: {}, misTraded: false,

/* ======================================================================
   Paper broker: order validation, matching, positions, margin, charges.
   ====================================================================== */
const Broker = {
  inst(sym) { return feed && feed.inst[sym]; },
  ltp(sym) { const I = this.inst(sym); return I ? I.ltp : (A.lastCloses[sym] ?? BYSYM[sym]?.prev); },
  positions() { return A.day ? Object.values(A.day.positions) : []; },
  pendingOrders() { return A.day ? A.day.orders.filter(o => o.status === 'OPEN' || o.status === 'TRIGGER PENDING' || o.status === 'AMO') : []; },
  misUsed() { let m = 0; for (const p of this.positions()) if (p.product === 'MIS') m += Math.abs(p.net) * p.avg * MIS_MARGIN; return m; },
  misUnreal() { let u = 0; for (const p of this.positions()) if (p.product === 'MIS' && p.net) u += (this.ltp(p.sym) - p.avg) * p.net; return u; },
  reducingQty(o) {
    const p = A.day && A.day.positions[posKey(o.sym, o.product)];
    if (!p || !p.net) return 0;
    const s = o.side === 'BUY' ? 1 : -1;
    return Math.sign(p.net) !== s ? Math.min(o.qty, Math.abs(p.net)) : 0;
  },
  orderMargin(o) {
    const px = o.type === 'LIMIT' || o.type === 'SL' ? o.price : (o.type === 'SL-M' ? o.trigger : (o.side === 'BUY' ? (this.inst(o.sym)?.ask ?? this.ltp(o.sym)) : (this.inst(o.sym)?.bid ?? this.ltp(o.sym))));
    if (o.product === 'CNC' && o.side === 'SELL') return 0;
    const newQty = o.qty - this.reducingQty(o);
    return newQty * px * (o.product === 'MIS' ? MIS_MARGIN : 1);
  },
  openOrderMargin(except) { let m = 0; for (const o of this.pendingOrders()) if (o !== except) m += this.orderMargin(o); return m; },
  available(except) { return A.cash - this.misUsed() - this.openOrderMargin(except) + Math.min(0, this.misUnreal()); },
  holdingsQty(sym) { return A.holdings[sym]?.qty || 0; },
  worth() {
    let w = A.cash;
    for (const s in A.holdings) w += A.holdings[s].qty * this.ltp(s);
    for (const p of this.positions()) { if (p.product === 'CNC' && p.net > 0) w += p.net * this.ltp(p.sym); if (p.product === 'MIS' && p.net) w += (this.ltp(p.sym) - p.avg) * p.net; }
    return w;
  },
  validate(o, isModify) {
    const u = BYSYM[o.sym], I = this.inst(o.sym);
    if (!u) return 'Unknown instrument.';
    if (u.kind === 'index') return "Indices can't be bought or sold directly. Trade NIFTYBEES, an ETF that tracks the Nifty 50.";
    if (!Number.isInteger(o.qty) || o.qty < 1) return 'Quantity must be a whole number of shares, at least 1.';
    const tick = I ? I.tick : tickFor(this.ltp(o.sym), u.kind);
    const ltp = this.ltp(o.sym);
    const lower = I ? I.lower : roundT(ltp * 0.9, tick), upper = I ? I.upper : roundT(ltp * 1.1, tick);
    if (o.type === 'LIMIT' || o.type === 'SL') {

      if (!onTick(o.price, tick)) return `Tick size for ${o.sym} is ₹${tick.toFixed(2)}. Enter a price in multiples of the tick size.`;
      if (o.price < lower || o.price > upper) return `Price is outside the day's price band (₹${f2(lower)} – ₹${f2(upper)}).`;
    }

      if (o.side === 'BUY' && o.trigger <= ltp) return 'Trigger price for stop-loss buy orders should be higher than the last traded price.';
      if (o.side === 'SELL' && o.trigger >= ltp) return 'Trigger price for stop-loss sell orders should be lower than the last traded price.';
      if (o.type === 'SL' && o.side === 'BUY' && o.trigger > o.price) return 'For a stop-loss buy, the trigger price must be lower than or equal to the limit price.';
      if (o.type === 'SL' && o.side === 'SELL' && o.trigger < o.price) return 'For a stop-loss sell, the trigger price must be higher than or equal to the limit price.';

    if (o.product === 'CNC' && o.side === 'SELL') {
      const p = A.day && A.day.positions[posKey(o.sym, 'CNC')];
      const today = p ? Math.max(0, p.net) : 0;
      const pendingSells = this.pendingOrders().filter(x => x !== o && x.sym === o.sym && x.product === 'CNC' && x.side === 'SELL').reduce((a, x) => a + x.qty, 0);
      if (o.qty > this.holdingsQty(o.sym) + today - pendingSells) return (this.holdingsQty(o.sym) + today) > 0 ? `You can sell at most ${this.holdingsQty(o.sym) + today - pendingSells} shares of ${o.sym} in CNC (holdings plus today's buys, minus pending sells).` : "Short selling isn't allowed in CNC (delivery). Use Intraday (MIS) to sell first and buy back the same day.";
    }
    const need = this.orderMargin(o), avail = this.available(isModify ? o : null);
    if (need > avail + 1e-6) return `Insufficient funds. Required margin is ₹${f2(need)} but available margin is ₹${f2(avail)}. Check the order book for open orders.`;
    return null;
  },
  place(req) {
    if (!A.day) {
      if (feed.mode === 'live') { if (!startDay()) return { status: 'REJECTED', reason: 'The market is closed, so there is no live session to trade in.', sym: req.sym, side: req.side, qty: req.qty }; }
      else if (feed.mode === 'replay' && feed.sec >= T_CLOSE) return { status: 'REJECTED', reason: 'This replay has finished. Pick another day under market data, or switch to the practice market.', sym: req.sym, side: req.side, qty: req.qty };
      else A.day = newDay(feed.mode, feed.date);
    }
    const o = { id: 'O' + (A.seq++), date: A.day.date, t: feed ? feed.sec : T_PRE, sym: req.sym, side: req.side, qty: req.qty | 0, type: req.type, product: req.product, price: req.price ?? null, trigger: req.trigger ?? null, status: 'OPEN', avg: null, filledAt: null, reason: '', tag: req.tag || '', stopPlan: req.stopPlan ?? null, autoStop: !!req.autoStop, resting: false };
    if (o.type === 'MARKET' || o.type === 'SL-M') o.price = null;
    if (o.type === 'MARKET' || o.type === 'LIMIT') o.trigger = null;
    const err = this.validate(o, false);
    A.day.orders.unshift(o);
    if (err) { o.status = 'REJECTED'; o.reason = err; emit('rejected', { order: o }); markDirty(); return o; }
    const ph = curPhase();
    if (!feed || !feed.started || ph === 'closed') { o.status = 'AMO'; o.reason = 'After-market order: goes to the exchange at the next open.'; }
    else if (ph === 'pre') { o.status = o.type === 'SL' || o.type === 'SL-M' ? 'TRIGGER PENDING' : 'OPEN'; }
    else if (o.type === 'SL' || o.type === 'SL-M') o.status = 'TRIGGER PENDING';
    emit('placed', { order: o });
    if (o.status === 'OPEN' && ph !== 'pre') this.tryFill(o, true);
    markDirty();
    return o;
  },
  modify(o, ch) {
    if (!['OPEN', 'TRIGGER PENDING', 'AMO'].includes(o.status)) return 'Only open orders can be modified.';
    const test = { ...o, ...ch };
    if (test.type === 'MARKET' || test.type === 'SL-M') test.price = null;
    if (test.type === 'MARKET' || test.type === 'LIMIT') test.trigger = null;
    const err = this.validate(test, true);
    if (err) return err;
    Object.assign(o, { qty: test.qty, price: test.price, trigger: test.trigger, type: test.type, resting: false });
    if (o.status !== 'AMO') o.status = (o.type === 'SL' || o.type === 'SL-M') && !o.triggered ? 'TRIGGER PENDING' : 'OPEN';
    emit('modified', { order: o });
    if (o.status === 'OPEN' && ['open', 'closing'].includes(curPhase())) this.tryFill(o, true);
    markDirty();
    return null;
  },
  cancel(o, reason) {
    if (!['OPEN', 'TRIGGER PENDING', 'AMO'].includes(o.status)) return;
    o.status = 'CANCELLED'; o.reason = reason || '';
    emit('cancelled', { order: o }); markDirty();
  },
  // Fill price for a market order: walk the order book.
  marketPrice(o, I) {
    const d = depthOf(I, feed.sec);
    const lv = o.side === 'BUY' ? d.asks : d.bids;
    let rem = o.qty, cost = 0, last = lv[0][0];
    for (const [p, q] of lv) { const take = Math.min(rem, q); cost += take * p; rem -= take; last = p; if (!rem) break; }
    if (rem > 0) { const worse = +(last + (o.side === 'BUY' ? 1 : -1) * I.tick * Math.ceil(rem / Math.max(1, lv[lv.length - 1][1]))).toFixed(2); cost += rem * worse; }
    return cost / o.qty;
  },
  tryFill(o, fresh) {
    const I = this.inst(o.sym); if (!I || I.bid == null) return;
    if (o.status === 'TRIGGER PENDING') {
      const hit = o.side === 'BUY' ? I.ltp >= o.trigger : I.ltp <= o.trigger;
      if (!hit) return;
      o.triggered = true; o.status = 'OPEN'; o.resting = false; fresh = true;
      emit('triggered', { order: o });
    }
    if (o.status !== 'OPEN') return;
    if (o.type === 'MARKET' || o.type === 'SL-M') return this.fill(o, this.marketPrice(o, I));
    // LIMIT and triggered SL
    if (o.side === 'BUY') {
      if (I.ask <= o.price && (fresh || !o.resting)) return this.fill(o, I.ask);
      if (o.resting && (I.ltp < o.price || (I.ltp === o.price && rand() < 0.3))) return this.fill(o, o.price);
    } else {
      if (I.bid >= o.price && (fresh || !o.resting)) return this.fill(o, I.bid);
      if (o.resting && (I.ltp > o.price || (I.ltp === o.price && rand() < 0.3))) return this.fill(o, o.price);
    }
    o.resting = true;
  },
  // Opening match at 09:15: all eligible orders trade at the open price.
  atOpen() {
    for (const o of this.pendingOrders()) {
      if (o.status === 'AMO') o.status = (o.type === 'SL' || o.type === 'SL-M') ? 'TRIGGER PENDING' : 'OPEN';
      const I = this.inst(o.sym); if (!I) continue;
      if (o.status === 'OPEN') {
        if (o.type === 'MARKET') this.fill(o, I.open);
        else if (o.type === 'LIMIT' && (o.side === 'BUY' ? o.price >= I.open : o.price <= I.open)) this.fill(o, I.open);
        else o.resting = true;
      }
    }
  },
  onStep() { for (const o of this.pendingOrders()) if (o.status !== 'AMO') this.tryFill(o, false); },
  fill(o, price, tag) {
    price = r2(price);
    const D = A.day, I = this.inst(o.sym), key = posKey(o.sym, o.product);
    const value = price * o.qty;
    let ch = zeroCh(), realized = 0;
    let p = D.positions[key];
    const holdOnly = o.product === 'CNC' && o.side === 'SELL' && (!p || p.net <= 0);
    if (!p) p = { sym: o.sym, product: o.product, net: 0, avg: 0, buyQty: 0, buyVal: 0, sellQty: 0, sellVal: 0, realized: 0, tripId: null };
    if (!holdOnly) D.positions[key] = p; // a sale purely from holdings doesn't open a position line
    const before = p.net;
    let fromHold = 0;
    if (o.product === 'CNC' && o.side === 'SELL') {
      const fromToday = Math.min(o.qty, Math.max(0, p.net)); fromHold = o.qty - fromToday;
      if (fromToday) {
        addCh(ch, charges('SELL', price * fromToday, false));
        // Buying and selling the same day in CNC is treated as intraday: undo the delivery STT/stamp on the buy leg, add intraday brokerage.
        const bv = p.avg * fromToday, bb = Math.min(RATE.brokCap, bv * RATE.brokPct);
        addCh(ch, { stt: -bv * RATE.sttDel, stamp: -bv * (RATE.stampDel - RATE.stampIntra), brokerage: bb, gst: bb * RATE.gst, total: -bv * RATE.sttDel - bv * (RATE.stampDel - RATE.stampIntra) + bb * (1 + RATE.gst) });
      }
      if (fromHold) { addCh(ch, charges('SELL', price * fromHold, true)); if (!D.dpDone[o.sym]) { D.dpDone[o.sym] = 1; ch.dp += RATE.dp; ch.total += RATE.dp; } }
    } else addCh(ch, charges(o.side, value, o.product === 'CNC'));
    if (tag === 'autosq') { const a = RATE.autoSq * (1 + RATE.gst); ch.autosq += a; ch.total += a; }
    // Position bookkeeping (average-cost method)
    const s = o.side === 'BUY' ? 1 : -1;
    const qtyPos = o.qty - fromHold;
    if (qtyPos > 0) {
      if (p.net === 0 || Math.sign(p.net) === s) { p.avg = (p.avg * Math.abs(p.net) + price * qtyPos) / (Math.abs(p.net) + qtyPos); p.net += s * qtyPos; }
      else {
        const cq = Math.min(qtyPos, Math.abs(p.net));
        realized += (price - p.avg) * cq * Math.sign(p.net);
        p.net += s * cq;
        const rem = qtyPos - cq;
        if (p.net === 0) p.avg = 0;
        if (rem > 0) { p.net = s * rem; p.avg = price; }
      }
      if (s > 0) { p.buyQty += qtyPos; p.buyVal += qtyPos * price; } else { p.sellQty += qtyPos; p.sellVal += qtyPos * price; }
    }
    let holdRealized = 0, holdTrip = null;
    if (fromHold) {
      const h = A.holdings[o.sym];
      holdRealized = (price - h.avg) * fromHold;
      holdTrip = h.tripId;
      h.qty -= fromHold; if (h.qty <= 0) delete A.holdings[o.sym];
    }
    p.realized += realized;
    // Cash
    if (o.product === 'MIS') A.cash += realized - ch.total;
    else if (o.side === 'BUY') A.cash -= value + ch.total;
    else A.cash += value - ch.total;
    addCh(D.ch, ch);
    if (o.product === 'MIS') D.misTraded = true;
    o.status = 'COMPLETE'; o.avg = price; o.filledAt = feed ? feed.sec : T_OPEN; o.charges = ch.total;
    const fill = { id: 'F' + (A.seq++), order: o.id, sym: o.sym, side: o.side, qty: o.qty, price, product: o.product, t: o.filledAt, date: D.date, ch: ch.total, time: chartTime(D.date, o.filledAt - (o.filledAt - T_OPEN) % 60) };
    D.fills.push(fill);
    this.trackTrips(o, p, before, price, realized, ch.total, fromHold, holdRealized, holdTrip);
    emit('filled', { order: o, fill, before, after: p.net, pos: p });
    if (o.autoStop && o.stopPlan && Math.abs(p.net) > Math.abs(before) && (o.side === 'BUY' ? o.stopPlan < price : o.stopPlan > price)) {
      const stopSide = o.side === 'BUY' ? 'SELL' : 'BUY';
      const I2 = this.inst(o.sym);
      const trig = o.side === 'BUY' ? floorT(o.stopPlan, I2.tick) : ceilT(o.stopPlan, I2.tick);
      const so = this.place({ sym: o.sym, side: stopSide, qty: o.qty, type: 'SL-M', product: o.product, trigger: trig, tag: 'auto-stop' });
      if (so.status !== 'REJECTED') coach(`Stop placed: SL-M ${stopSide.toLowerCase()} ${o.qty} ${o.sym} at trigger ₹${f2(trig)}.`, 'coach');
    }
    // Cancel exit orders that no longer have a position to close
    if (p.net === 0 && !holdOnly) for (const x of this.pendingOrders()) if (x.sym === o.sym && x.product === o.product && (x.tag === 'auto-stop' || x.tag === 'exit')) this.cancel(x, 'Position closed, so this exit order was cancelled.');
    markDirty();
  },
  trackTrips(o, p, before, price, realized, chTotal, fromHold, holdRealized, holdTrip) {
    const D = A.day;
    const findTrip = id => A.trips.find(t => t.id === id);
    if (fromHold && holdTrip) {
      const t = findTrip(holdTrip);
      if (t) {
        const q = fromHold; t.exitVal += price * q; t.exitQty += q; t.gross += holdRealized; t.charges += chTotal * (q / o.qty);
        if (!A.holdings[o.sym]) this.closeTrip(t, o.filledAt);
      }
    }
    const qtyPos = o.qty - fromHold; if (!qtyPos) return;
    const chPos = chTotal * (qtyPos / o.qty);
    let t = p.tripId ? findTrip(p.tripId) : null;
    if (before === 0 || !t) {
      t = this.openTrip(o, p, price, qtyPos, chPos);
      return;
    }
    if (Math.sign(p.net) === Math.sign(before) && Math.abs(p.net) > Math.abs(before)) {
      t.entryVal += price * qtyPos; t.entryQty += qtyPos; t.maxQty = Math.max(t.maxQty, Math.abs(p.net)); t.charges += chPos;
      return;
    }
    const cq = Math.min(qtyPos, Math.abs(before));
    t.exitVal += price * cq; t.exitQty += cq; t.gross += realized; t.charges += chPos * (cq / qtyPos);
    if (p.net === 0 || Math.sign(p.net) !== Math.sign(before)) {
      this.closeTrip(t, o.filledAt);
      p.tripId = null;
      if (p.net !== 0) this.openTrip(o, p, price, Math.abs(p.net), chPos * (1 - cq / qtyPos));
    }
  },
  openTrip(o, p, price, qty, ch) {
    const I = this.inst(o.sym);
    const t = { id: 'T' + (A.seq++), sym: o.sym, product: o.product, side: p.net > 0 ? 'LONG' : 'SHORT', openDate: A.day.date, openSec: o.filledAt, entryVal: price * qty, entryQty: qty, maxQty: qty, exitVal: 0, exitQty: 0, gross: 0, charges: ch, net: null, risk: null, r: null, setup: '', note: '', status: 'open', stopUsed: false, closeDate: null, closeSec: null, vwapReclaim: false };
    if (o.stopPlan) { t.risk = Math.abs(price - o.stopPlan) * qty; t.stopUsed = !!o.autoStop; }
    // VWAP reclaim check: price now on one side of VWAP after being on the other within 5 minutes
    if (I && I.vwap && I.candles.length > 2) {
      const recent = I.candles.slice(-6, -1);
      if (t.side === 'LONG' && price > I.vwap && recent.some(c => c.close < c.vw)) t.vwapReclaim = true;
      if (t.side === 'SHORT' && price < I.vwap && recent.some(c => c.close > c.vw)) t.vwapReclaim = true;
    }
    A.trips.unshift(t); if (A.trips.length > 400) A.trips.length = 400;
    p.tripId = t.id;
    emit('trip_open', { trip: t, order: o });
    return t;
  },
  closeTrip(t, sec) {
    t.status = 'closed'; t.closeDate = A.day.date; t.closeSec = sec;
    t.net = t.gross - t.charges; t.r = t.risk ? t.gross / t.risk : null;
    A.day.tripsClosed++;
    emit('trip_closed', { trip: t });
  },
  squareOffMIS() {
    let n = 0;
    for (const o of this.pendingOrders()) if (o.product === 'MIS') this.cancel(o, 'Cancelled at the 15:25 intraday auto square-off.');
    for (const p of this.positions()) if (p.product === 'MIS' && p.net) {
      const I = this.inst(p.sym);
      const o = { id: 'O' + (A.seq++), date: A.day.date, t: feed.sec, sym: p.sym, side: p.net > 0 ? 'SELL' : 'BUY', qty: Math.abs(p.net), type: 'MARKET', product: 'MIS', price: null, trigger: null, status: 'OPEN', tag: 'auto square-off', reason: 'Squared off by the broker at 15:25 (₹50 + GST charged).' };
      A.day.orders.unshift(o);
      this.fill(o, this.marketPrice(o, I), 'autosq'); n++;
    }
    if (n) { A.day.autoSq += n; coach(`Auto square-off closed ${n} intraday position${n > 1 ? 's' : ''}. That cost ₹${f2(n * RATE.autoSq * (1 + RATE.gst))} extra. Close MIS trades yourself before 15:25.`, 'bad'); }
  },
};

const ALLM = LEVELS.flatMap((L, li) => L.m.map(m => ({ ...m, level: li, xp: L.xp })));
function curLevel() { for (let i = 0; i < LEVELS.length; i++) if (LEVELS[i].m.some(m => !A.missions[m.id])) return i; return LEVELS.length - 1; }
function curMission() { const L = LEVELS[curLevel()]; return L.m.find(m => !A.missions[m.id]) || null; }
function rankOf(xp) { let i = 0; for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k; return i; }
function award(id) {
  if (A.missions[id]) return;
  const m = ALLM.find(x => x.id === id); if (!m) return;
  const r0 = rankOf(A.xp);
  A.missions[id] = Date.now(); A.xp += m.xp;
  coach(`Mission complete: ${m.t} (+${m.xp} XP)`, 'good');
  const r1 = rankOf(A.xp);
  if (r1 > r0) toast(`New rank: ${RANKS[r1][1]}`);
  const L = LEVELS[m.level];
  if (L.m.every(x => A.missions[x.id])) coach(`Level ${m.level + 1} cleared: ${L.n}.`, 'good');
  quiz = null; markDirty(); renderCoach(); renderTop();
}
function addXP(n, why) { const r0 = rankOf(A.xp); A.xp += n; if (why) coach(`${why} (+${n} XP)`, 'good'); if (rankOf(A.xp) > r0) toast(`New rank: ${RANKS[rankOf(A.xp)][1]}`); markDirty(); }

/* Events → missions and coaching */
function emit(type, e) {
  const o = e.order;
  switch (type) {
    case 'rejected': coach(`Rejected: ${o.side} ${o.qty} ${o.sym}. ${o.reason}`, 'bad'); toast('Order rejected: ' + o.reason); break;
    case 'placed':
      if (o.status === 'AMO') coach(`After-market order queued: ${o.side} ${o.qty} ${o.sym} (${o.type}). It goes to the exchange at the next open.`);
      if ((o.type === 'SL' || o.type === 'SL-M') && Broker.reducingQty(o) > 0) {
        award('stop');
        const p = A.day.positions[posKey(o.sym, o.product)], t = p && p.tripId && A.trips.find(x => x.id === p.tripId);
        if (t) { t.stopUsed = true; if (!t.risk) t.risk = Math.abs(t.entryVal / t.entryQty - o.trigger) * Math.abs(p.net); }
      }
      break;
    case 'modified': award('modify'); coach(`Modified ${o.id}: ${o.side} ${o.qty} ${o.sym} ${o.type}${o.price ? ' @ ₹' + f2(o.price) : ''}${o.trigger ? ' trigger ₹' + f2(o.trigger) : ''}.`); break;
    case 'cancelled': if (o.reason) coach(`Cancelled ${o.side} ${o.qty} ${o.sym}. ${o.reason}`); break;
    case 'triggered': coach(`Stop triggered: ${o.side} ${o.qty} ${o.sym} at trigger ₹${f2(o.trigger)}.`); break;
    case 'filled': {

/* Live mode polling */
let liveTimer = null;
async function pollLive() {
  try {

const f2n = x => (+x).toFixed(2);
function closeTicket() { $('#ticket').hidden = true; $('#scrim').hidden = true; T.modify = null; }
function readTicket() {
  const type = $('input[name=otype]:checked').value, product = $('input[name=prod]:checked').value;
  return { sym: T.sym, side: T.side, qty: Math.floor(+$('#tQty').value), type, product, price: type === 'LIMIT' || type === 'SL' ? +$('#tPrice').value : null, trigger: type === 'SL' || type === 'SL-M' ? +$('#tTrig').value : null, stopPlan: +$('#tStop').value || null, autoStop: $('#tAuto').checked };
}
function syncTicket() {
  if ($('#ticket').hidden) return;
  const r = readTicket(), I = feed && feed.inst[T.sym], ltp = Broker.ltp(T.sym), buy = T.side === 'BUY';
  $('#tHead').className = 'thead ' + (buy ? 'buy' : 'sell');
  $('#tTitle').textContent = `${T.modify ? 'Modify ' : ''}${buy ? 'Buy' : 'Sell'} ${T.sym}`;
  $('#tSub').textContent = `NSE · LTP ₹${f2(ltp)}${I && I.bid != null ? ` · bid ${f2(I.bid)} / offer ${f2(I.ask)}` : ''}`;
  $('#tFlip').setAttribute('aria-checked', String(!buy));
  $('#tPrice').disabled = !(r.type === 'LIMIT' || r.type === 'SL');
  $('#tTrig').disabled = !(r.type === 'SL' || r.type === 'SL-M');
  const go = $('#tGo'); go.className = 'btn ' + (buy ? 'buy' : 'sell'); go.textContent = T.modify ? 'Modify' : (buy ? 'Buy' : 'Sell');
  const px = r.type === 'LIMIT' || r.type === 'SL' ? r.price : r.type === 'SL-M' ? r.trigger : (buy ? (I?.ask ?? ltp) : (I?.bid ?? ltp));
  const fake = { ...r, status: 'NEW' };
  const need = (r.qty > 0 && px > 0) ? Broker.orderMargin({ ...fake, price: r.type === 'LIMIT' || r.type === 'SL' ? r.price : null, trigger: r.trigger }) : 0;
  const value = (r.qty || 0) * (px || 0);
  const delivery = r.product === 'CNC';
  const est = charges('BUY', value, delivery).total + charges('SELL', value, delivery).total + (delivery ? RATE.dp : 0);
  const be = r.qty > 0 ? est / r.qty : 0;
  $('#tSum').innerHTML = `<div class="kv"><span>Order value</span><b>${rs(value)}</b></div><div class="kv"><span>Margin required${r.product === 'MIS' ? ' (20%)' : ''}</span><b>${rs(need)}</b></div><div class="kv"><span>Available margin</span><b>${rs(Broker.available(T.modify && A.day ? A.day.orders.find(x => x.id === T.modify) : null))}</b></div><div class="kv"><span>Round-trip charges (est.)</span><b>${rs(est)}</b></div><div class="kv"><span>Breakeven move</span><b>₹${f2(be)} / share</b></div>`;
  // risk planner
  const stop = r.stopPlan, entry = px;
  if (stop && entry) {
    const ok = buy ? stop < entry : stop > entry;
    const per = Math.abs(entry - stop), tot = per * (r.qty || 0), pctCap = tot / A.capital * 100;
    $('#tRR').innerHTML = ok ? `<span>Risk per share</span><b>₹${f2(per)}</b><span>Total risk</span><b>₹${f2(tot)}</b><span>Of capital</span><b class="${pctCap > 1.0001 ? 'down' : 'up'}">${pctCap.toFixed(2)}%</b><span>2R target</span><b>₹${f2(buy ? entry + 2 * per : entry - 2 * per)}</b>` : `<span class="down" style="grid-column:1/3">For a ${buy ? 'buy' : 'sell'}, the stop must be ${buy ? 'below' : 'above'} the entry price.</span>`;
  } else $('#tRR').innerHTML = `<span style="grid-column:1/3">Type where you'd be wrong. The planner shows your risk and sizes the trade.</span>`;
}
function sizeOnePct() {
  const r = readTicket(), I = feed && feed.inst[T.sym], buy = T.side === 'BUY', ltp = Broker.ltp(T.sym);
  const entry = r.type === 'LIMIT' || r.type === 'SL' ? r.price : r.type === 'SL-M' ? r.trigger : (buy ? (I?.ask ?? ltp) : (I?.bid ?? ltp));
  if (!r.stopPlan || !entry) { msg('Enter a stop-loss price first.', 'err'); return; }
  const per = Math.abs(entry - r.stopPlan);
  if ((buy && r.stopPlan >= entry) || (!buy && r.stopPlan <= entry)) { msg(`For a ${buy ? 'buy' : 'sell'}, the stop must be ${buy ? 'below' : 'above'} the entry.`, 'err'); return; }
  let q = Math.floor(A.capital * 0.01 / per);
  const cap = Math.floor(Broker.available() / (entry * (r.product === 'MIS' ? MIS_MARGIN : 1)));
  if (q > cap) { q = cap; msg(`Capped at ${cap} shares by available margin.`, ''); } else msg(`${q} shares risks ₹${f2(q * per)}, about 1% of capital.`, 'ok');
  $('#tQty').value = Math.max(1, q); $('#tAuto').checked = true; syncTicket();
}
function msg(t, k) { const e = $('#tMsg'); e.textContent = t; e.className = 'tmsg ' + (k || ''); }
function submitTicket() {
  const r = readTicket();
  if (T.modify) {
    const o = A.day && A.day.orders.find(x => x.id === T.modify);
    if (!o) { closeTicket(); return; }
    const err = Broker.modify(o, { qty: r.qty, price: r.price, trigger: r.trigger, type: r.type });
    if (err) { msg(err, 'err'); return; }
    closeTicket(); toast('Order modified'); render(); return;
  }
  const o = Broker.place(r);
  if (o.status === 'REJECTED') { msg(o.reason, 'err'); render(); return; }
  closeTicket();
  toast(o.status === 'COMPLETE' ? `Executed ${o.side} ${o.qty} ${o.sym} @ ₹${f2(o.avg)}` : o.status === 'AMO' ? 'After-market order placed' : `Order placed: ${o.status.toLowerCase()}`);
  render();
}

  $('#dlg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.close) closeDlg();
    if (b.dataset.nextday) { closeDlg(); startDay(); }
    if (b.dataset.mode === 'sim') useSim();
    if (b.dataset.mode === 'replay') pickReplay();
    if (b.dataset.mode === 'live') startLive();
    if (b.dataset.rday) startReplay(b.dataset.rday);
  });
  $('#mcard').addEventListener('click', e => {
    const b = e.target.closest('button[data-quiz]'); if (!b || !quiz) return;
    if (+b.dataset.quiz === quiz.ans) { award('spread'); }
    else { b.classList.add('wrong'); coach('Not quite. Spread = best offer − best bid.', 'coach'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeTicket(); closeDlg(); return; }
    if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('#ticket').hidden || !$('#dlg').hidden) return;
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); openTicket('BUY', selected); }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); openTicket('SELL', selected); }
    if (e.key === ' ' && feed && feed.mode !== 'live' && A.day && feed.started) { e.preventDefault(); running = !running; renderTop(); }
  });
  // theme changes → chart colors
  const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', () => Chart.readColors());
  new MutationObserver(() => Chart.readColors()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  setInterval(() => { renderTop(); if (!$('#ticket').hidden) syncTicket(); }, 500);
}
function selectSym(s) {
  selected = s; Chart.offset = 0;
  if (BYSYM[s].kind !== 'index') award('select');
  if (curMission()?.id === 'spread') { quiz = null; }
  render();
}

/* ======================================================================
   Boot
   ====================================================================== */
function boot(hot) {
  wire();
  Chart.init($('#chart'));
  const local = hot && hot.A ? hot.A : Store.loadLocal();
  if (local && local.v === 1) A = local;
  speed = A.speed || 20;
  // Resume a practice day from this browser, or settle a stale one.
  if (A.day) {
    let resumed = false;
    if (A.day.mode === 'sim') {
      try { const snap = JSON.parse(localStorage.getItem('dojo.feed') || 'null'); if (snap && snap.date === A.day.date) { feed = SimFeed.restore(snap); resumed = true; } } catch (e) {}
    }
    if (!resumed && !(A.day.mode !== 'sim' && LOCAL)) settleStale();
  }
  if (!feed) feed = new SimFeed(A.day && A.day.mode === 'sim' ? A.day.date : A.nextDate, A.lastCloses);
  if (A.day && feed.mode === 'sim' && feed.started) coach(`Resumed ${dFmt(A.day.date)} at ${hm(feed.sec)}. Press Resume to continue.`);
  else coach('Welcome to the dojo. You have ₹' + f0(A.capital) + ' of paper money. Work through the missions on the right; press Start trading day when ready.');
  render();
  requestAnimationFrame(loop);
  // Sync with the viewer's saved account on claude.ai
  Store.connect().then(remote => {
    if (remote && remote.v === 1 && (remote.savedAt || 0) > (A.savedAt || 0) && !running) {
      A = JSON.parse(JSON.stringify(remote)); speed = A.speed || 20;
      const canResume = A.day && feed && feed.mode === 'sim' && feed.date === A.day.date && feed.started;
      if (A.day && !canResume) settleStale();
      if (!canResume) feed = new SimFeed(A.nextDate, A.lastCloses);
      quiz = null; journalHash = ''; coach('Loaded your saved progress.'); render();
    } else if (Store.db) { markDirty(); }
  });
  // Companion app (local)
  if (LOCAL) fetch('/api/status').then(r => r.json()).then(s => {
    server = s;
    $('#feedNote').textContent = s.feeds && (s.feeds.kite || s.feeds.yahoo) ? 'Companion app connected' : 'Companion app: practice only';
    if (A.day && A.day.mode === 'live' && s.feeds && (s.feeds.kite || s.feeds.yahoo)) startLive();
    else if (A.day && A.day.mode === 'replay') settleStale();
  }).catch(() => {});
  window.claude?.hot?.snapshot?.(() => ({ A }));
  window.dojo = { get A() { return A; }, get feed() { return feed; }, Broker, startDay, endDay, advance, setSpeed: s => { speed = s; }, pause: () => { running = false; } };
}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? null);
})();
</script>
